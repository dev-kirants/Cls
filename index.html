<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Attendance Ledger — Student Attendance Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#211316;
    --paper:#EFEDE5;
    --surface:#FFFFFF;
    --line:#DAD4C6;
    --muted:#726B62;
    --primary:#7A1E2C;
    --primary-dark:#5A141F;
    --primary-tint:#F3E1E1;
    --gold:#B9862E;
    --success:#2F6F4E;
    --success-tint:#E4EFE8;
    --warning:#B8860B;
    --warning-tint:#F7EDD6;
    --danger:#A33636;
    --danger-tint:#F5E1DF;
    --radius:4px;
    --font-serif:'Source Serif 4', Georgia, serif;
    --font-sans:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:var(--font-sans); line-height:1.4;}
  h1,h2,h3{font-family:var(--font-serif); margin:0;}
  button, input, select{font-family:var(--font-sans);}
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible{outline:2px solid var(--primary); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }

  .view{display:none;}
  .view.active{display:block;}

  /* ---------- Login ---------- */
  .login-wrap{min-height:100vh; display:grid; grid-template-columns:1.1fr 1fr;}
  @media (max-width:860px){ .login-wrap{grid-template-columns:1fr;} }
  .login-hero{background:var(--ink); color:var(--paper); padding:64px 56px; display:flex; flex-direction:column; justify-content:center; gap:22px;}
  .login-hero .eyebrow{color:var(--gold); font-weight:600; font-size:0.85rem; letter-spacing:0.02em;}
  .login-hero h1{font-size:clamp(2.1rem,4vw,3.2rem); line-height:1.12; font-weight:600; max-width:11ch; color:#F6F2EA;}
  .login-hero p{color:#D9D2C6; max-width:42ch; line-height:1.65; font-size:1rem;}
  .ledger-mark{display:flex; flex-direction:column; gap:14px; margin-top:8px;}
  .ledger-row{display:flex; align-items:center; gap:12px;}
  .ledger-dot{width:13px; height:13px; border-radius:50%; border:2px solid #6b5d52; flex-shrink:0;}
  .ledger-dot.done{background:var(--gold); border-color:var(--gold);}
  .ledger-line{height:2px; background:rgba(255,255,255,0.16); flex:1;}
  .ledger-line.short{width:55%; flex:none;}

  .login-form-wrap{display:flex; align-items:center; justify-content:center; padding:48px 24px; background:var(--paper);}
  .login-card{width:100%; max-width:400px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:32px;}
  .role-tabs{display:flex; border-bottom:1px solid var(--line); margin-bottom:22px;}
  .role-tab{flex:1; padding:10px 4px; text-align:center; cursor:pointer; font-weight:600; font-size:0.9rem; color:var(--muted); background:none; border:none; border-bottom:2px solid transparent;}
  .role-tab.active{color:var(--primary); border-color:var(--primary);}
  .login-panel .field:last-of-type{margin-bottom:18px;}
  .hint{font-size:0.78rem; color:var(--muted); margin-top:16px; text-align:center; line-height:1.5;}

  /* ---------- Shared form / field styles ---------- */
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:0.82rem; color:var(--muted); margin-bottom:6px;}
  input, select{width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:var(--radius); font-size:0.92rem; background:var(--surface); color:var(--ink);}
  select[multiple]{padding:6px;}
  .form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:6px;}
  .form-row{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:12px;}
  .form-row .field{flex:1; min-width:170px; margin-bottom:0;}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 18px; border-radius:var(--radius); border:1px solid transparent; font-weight:600; font-size:0.88rem; cursor:pointer; transition:background-color .15s ease, border-color .15s ease, color .15s ease;}
  .btn-primary{background:var(--primary); color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-ghost{background:transparent; border-color:var(--line); color:var(--ink);}
  .btn-ghost:hover{background:var(--paper);}
  .btn-block{width:100%;}
  .btn-sm{padding:6px 12px; font-size:0.78rem;}
  .btn-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .file-btn{cursor:pointer;}

  /* ---------- Topbar ---------- */
  .topbar{display:none; align-items:center; justify-content:space-between; padding:14px 28px; background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;}
  .topbar .brand{font-family:var(--font-serif); font-weight:600; font-size:1.15rem; color:var(--primary);}
  .who-wrap{display:flex; align-items:center; gap:14px;}
  .who{font-size:0.85rem; color:var(--muted);}

  /* ---------- App shell ---------- */
  .app-shell{display:grid; grid-template-columns:220px 1fr; min-height:calc(100vh - 58px); align-items:start;}
  @media (max-width:760px){ .app-shell{grid-template-columns:1fr;} .sidebar{display:flex; overflow-x:auto; border-right:none; border-bottom:1px solid var(--line);} }
  .sidebar{background:var(--surface); border-right:1px solid var(--line); padding:20px 12px; position:sticky; top:58px;}
  .side-title{font-weight:600; padding:6px 12px; font-size:0.95rem;}
  .side-sub{color:var(--muted); font-size:0.76rem; padding:0 12px 14px;}
  .sidebar-link{display:block; width:100%; text-align:left; padding:10px 12px; border-radius:var(--radius); color:var(--muted); font-weight:500; font-size:0.88rem; background:none; border:none; cursor:pointer; margin-bottom:2px; white-space:nowrap;}
  .sidebar-link.active{background:var(--primary-tint); color:var(--primary-dark); font-weight:600;}
  .sidebar-link:hover{background:var(--paper);}
  .main{padding:28px; max-width:1180px; margin:0 auto; width:100%;}

  /* ---------- Page bits ---------- */
  .page-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; gap:14px; flex-wrap:wrap;}
  .page-head h1{font-size:1.7rem;}
  .sub{color:var(--muted); font-size:0.88rem; margin-top:4px;}
  .notice{padding:12px 16px; border-radius:var(--radius); margin-bottom:18px; font-size:0.88rem;}
  .notice-warning{background:var(--warning-tint); color:#7a5b06; border:1px solid var(--warning);}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-bottom:18px;}
  .card h3{font-size:1.05rem; margin-bottom:14px;}

  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:18px;}
  .stat-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px;}
  .stat-card .num{font-family:var(--font-serif); font-size:1.7rem; font-weight:600;}
  .stat-card .label{font-size:0.78rem; color:var(--muted); margin-top:2px;}

  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:760px){ .grid-2{grid-template-columns:1fr;} }

  table.table{width:100%; border-collapse:collapse; font-size:0.88rem;}
  .table th{text-align:left; padding:10px 12px; border-bottom:2px solid var(--ink); font-weight:600; font-size:0.76rem; color:var(--muted); text-transform:none;}
  .table td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:middle;}
  .table tr:hover td{background:var(--paper);}
  .empty{text-align:center; color:var(--muted); padding:26px !important;}

  .badge{display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:100px; font-size:0.75rem; font-weight:600;}
  .badge-success{background:var(--success-tint); color:var(--success);}
  .badge-warning{background:var(--warning-tint); color:var(--warning);}
  .badge-danger{background:var(--danger-tint); color:var(--danger);}

  .bar-track{background:var(--line); height:8px; border-radius:4px; overflow:hidden; width:100%; min-width:60px;}
  .bar-fill{height:100%; border-radius:4px;}
  .pct-cell{display:flex; flex-direction:column; gap:4px; min-width:90px;}
  .pct-cell span{font-size:0.82rem; font-weight:600;}

  .bar-list{display:flex; flex-direction:column; gap:11px;}
  .bar-row{display:grid; grid-template-columns:150px 1fr 46px; align-items:center; gap:10px; font-size:0.83rem;}
  .bar-label{color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bar-pct{text-align:right; font-weight:600;}

  .donut-wrap{display:flex; align-items:center; gap:26px; flex-wrap:wrap;}
  .donut{width:150px; height:150px; border-radius:50%; position:relative; display:grid; place-items:center; background:conic-gradient(var(--dc) calc(var(--pct)*1%), var(--line) 0);}
  .donut::before{content:''; position:absolute; inset:16px; border-radius:50%; background:var(--surface);}
  .donut span{position:relative; z-index:1; font-family:var(--font-serif); font-size:1.35rem; font-weight:600;}
  .donut-legend div{display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:0.88rem;}
  .dot{width:10px; height:10px; border-radius:50%; display:inline-block;}

  .trend{display:flex; gap:18px; align-items:flex-end; height:150px; padding-top:10px;}
  .trend-col{display:flex; flex-direction:column; align-items:center; gap:6px; flex:1;}
  .trend-bar-wrap{height:100px; display:flex; align-items:flex-end; width:100%; justify-content:center;}
  .trend-bar{width:30px; border-radius:3px 3px 0 0; background:var(--primary);}
  .trend-pct{font-size:0.8rem; font-weight:600;}
  .trend-label{font-size:0.76rem; color:var(--muted);}

  .toggle-group{display:flex; gap:6px;}
  .toggle-btn{padding:6px 12px; border:1px solid var(--line); background:var(--surface); border-radius:var(--radius); cursor:pointer; font-size:0.78rem; font-weight:600; color:var(--muted); transition:background-color .15s ease, border-color .15s ease, color .15s ease;}
  .toggle-btn.active-present{background:var(--success-tint); border-color:var(--success); color:var(--success);}
  .toggle-btn.active-absent{background:var(--danger-tint); border-color:var(--danger); color:var(--danger);}
  .mark-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  .save-confirm{margin-left:12px; color:var(--success); font-size:0.84rem;}

  /* ---------- Calendar ---------- */
  .cal-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  .cal-legend{display:flex; gap:14px; flex-wrap:wrap; font-size:0.78rem; color:var(--muted);}
  .cal-legend div{display:flex; align-items:center; gap:6px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal-dow{text-align:center; font-size:0.72rem; font-weight:600; color:var(--muted); padding-bottom:4px;}
  .cal-cell{aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); font-family:var(--font-sans); cursor:default; padding:2px;}
  .cal-cell.cal-clickable{cursor:pointer;}
  .cal-cell.cal-clickable:hover{border-color:var(--primary);}
  .cal-cell.cal-selected{outline:2px solid var(--primary); outline-offset:-2px;}
  .cal-cell.cal-empty{border:none; background:transparent;}
  .cal-cell.cal-none{color:var(--muted); background:var(--paper);}
  .cal-cell.cal-success{background:var(--success-tint); border-color:var(--success);}
  .cal-cell.cal-warning{background:var(--warning-tint); border-color:var(--warning);}
  .cal-cell.cal-danger{background:var(--danger-tint); border-color:var(--danger);}
  .cal-daynum{font-size:0.8rem; font-weight:600;}
  .cal-pct{font-size:0.66rem; font-weight:600;}
  .cal-detail-list{display:flex; flex-direction:column; gap:8px;}
  .cal-detail-row{display:flex; justify-content:space-between; align-items:center; padding:8px 12px; background:var(--paper); border-radius:var(--radius); font-size:0.85rem;}

  /* ---------- Print ---------- */
  #print-area{position:absolute; left:-9999px; top:0; width:800px; background:#fff; color:#000; padding:24px; font-family:var(--font-sans);}
  @media print{
    body > *:not(#print-area){display:none !important;}
    #print-area{position:static; left:auto; width:auto;}
  }
</style>
</head>
<body>

<div id="print-area"></div>

<header id="topbar" class="topbar">
  <div class="brand">Attendance Ledger</div>
  <div class="who-wrap">
    <span id="topbar-who" class="who"></span>
    <button id="logout-btn" class="btn btn-ghost btn-sm">Sign out</button>
  </div>
</header>

<section id="view-login" class="view active">
  <div class="login-wrap">
    <div class="login-hero">
      <div class="eyebrow">Attendance Ledger</div>
      <h1>Attendance, made visible.</h1>
      <p>One system for students, teachers and administrators — role-based dashboards, subject-wise records, and reports you can export in a click.</p>
      <div class="ledger-mark">
        <div class="ledger-row"><span class="ledger-dot done"></span><span class="ledger-line"></span></div>
        <div class="ledger-row"><span class="ledger-dot done"></span><span class="ledger-line"></span></div>
        <div class="ledger-row"><span class="ledger-dot"></span><span class="ledger-line short"></span></div>
      </div>
    </div>
    <div class="login-form-wrap">
      <div class="login-card">
        <div class="role-tabs">
          <button class="role-tab active" data-role="student">Student</button>
          <button class="role-tab" data-role="teacher">Teacher</button>
          <button class="role-tab" data-role="admin">Admin</button>
        </div>

        <div id="login-panel-student" class="login-panel">
          <div class="field"><label for="student-select">Register number</label><select id="student-select"></select></div>
          <div class="field"><label for="student-pass">Date of birth</label><input id="student-pass" type="password" value="demo"/></div>
          <button class="btn btn-primary btn-block" data-login="student">Sign in as student</button>
        </div>

        <div id="login-panel-teacher" class="login-panel" style="display:none">
          <div class="field"><label for="teacher-select">Teacher ID</label><select id="teacher-select"></select></div>
          <div class="field"><label for="teacher-pass">Password</label><input id="teacher-pass" type="password" value="demo"/></div>
          <button class="btn btn-primary btn-block" data-login="teacher">Sign in as teacher</button>
        </div>

        <div id="login-panel-admin" class="login-panel" style="display:none">
          <div class="field"><label>Admin username</label><input value="admin" disabled/></div>
          <div class="field"><label>Password</label><input type="password" value="demo"/></div>
          <button class="btn btn-primary btn-block" data-login="admin">Sign in as admin</button>
        </div>

        <p class="hint">Demo system — pick any record and sign in. No real credentials are checked.</p>
      </div>
    </div>
  </div>
</section>

<section id="view-student" class="view">
  <div class="app-shell">
    <nav class="sidebar" id="student-sidebar"></nav>
    <div class="main" id="student-content"></div>
  </div>
</section>

<section id="view-teacher" class="view">
  <div class="app-shell">
    <nav class="sidebar" id="teacher-sidebar"></nav>
    <div class="main" id="teacher-content"></div>
  </div>
</section>

<section id="view-admin" class="view">
  <div class="app-shell">
    <nav class="sidebar" id="admin-sidebar"></nav>
    <div class="main" id="admin-content"></div>
  </div>
</section>

<script>
/* ============================= DATA LAYER ============================= */
const DB = { classes:[], teachers:[], subjects:[], students:[], attendance:[] };

/* ============================= REMOTE SYNC (Google Sheets backend) =============================
   1. Deploy the companion Apps Script (Code.gs) as a Web App (see setup notes provided with this file).
   2. Paste the deployment URL below. Leave it as-is to run in local-only demo mode (no sharing). */
const API_URL = 'https://script.google.com/macros/s/AKfycbynNBRCUUV8v2WFbR2ewFylIduYqTgaie9buAjbK9pMw9wP5NB1TfuJlbL7yeQTHNeC/exec';
const BACKEND_ON = API_URL.indexOf('https://') === 0;

function apiCall(body){
  // text/plain avoids a CORS preflight against the Apps Script endpoint.
  return fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) })
    .then(r=>r.json());
}
function apiGetAll(){ return fetch(API_URL + '?action=getAll').then(r=>r.json()); }
function syncUpsert(table, row){ if(!BACKEND_ON) return; apiCall({action:'upsert', table, row}).catch(err=>console.error('[sync] upsert failed', table, err)); }
function syncBulkUpsert(table, rows){ if(!BACKEND_ON || !rows || !rows.length) return; apiCall({action:'bulkUpsert', table, rows}).catch(err=>console.error('[sync] bulkUpsert failed', table, err)); }
function syncDelete(table, id){ if(!BACKEND_ON) return; apiCall({action:'delete', table, id}).catch(err=>console.error('[sync] delete failed', table, err)); }
function syncSeedAll(){
  if(!BACKEND_ON) return Promise.resolve();
  return apiCall({action:'seed', payload:{classes:DB.classes, teachers:DB.teachers, subjects:DB.subjects, students:DB.students, attendance:DB.attendance}})
    .catch(err=>console.error('[sync] seed failed', err));
}

const monthsData = [
  {name:'June', prefix:'2026-06', dates:['2026-06-02','2026-06-03','2026-06-04','2026-06-05','2026-06-08','2026-06-09','2026-06-10','2026-06-11','2026-06-12','2026-06-15']},
  {name:'July', prefix:'2026-07', dates:['2026-07-01','2026-07-02','2026-07-03','2026-07-06','2026-07-07','2026-07-08','2026-07-09','2026-07-10','2026-07-13','2026-07-14']},
  {name:'August', prefix:'2026-08', dates:['2026-08-03','2026-08-04','2026-08-05','2026-08-06','2026-08-07','2026-08-10','2026-08-11','2026-08-12','2026-08-13','2026-08-14']},
  {name:'September', prefix:'2026-09', dates:['2026-09-01','2026-09-02','2026-09-03','2026-09-04','2026-09-07','2026-09-08']}
];

const subjectMonthRates = {
  SU1:{June:0.84, July:0.87, August:0.90, September:0.93},
  SU2:{June:0.83, July:0.86, August:0.89, September:0.90},
  SU3:{June:0.72, July:0.76, August:0.80, September:0.82},
  SU4:{June:0.83, July:0.85, August:0.88, September:0.90},
  SU5:{June:0.85, July:0.87, August:0.88, September:0.90},
  SU6:{June:0.88, July:0.90, August:0.91, September:0.93}
};

function mkStudent(id, regNo, name, dob, gender, classId){
  const cls = DB.classes.find(c=>c.id===classId);
  return {
    id, regNo, name, dob, gender,
    course:cls.course, dept:'Commerce', semester:cls.semester, section:cls.section,
    email:regNo.toLowerCase()+'@college.edu',
    phone:'98'+Math.floor(10000000+Math.random()*89999999),
    admissionYear:'20'+regNo.slice(0,2),
    status:'Active', classId
  };
}

function seedDB(){
  DB.classes = [
    {id:'CL1', course:'M.Com', semester:1, section:'A', year:'2025-26'},
    {id:'CL2', course:'M.Com', semester:2, section:'A', year:'2025-26'},
    {id:'CL3', course:'M.Com', semester:2, section:'B', year:'2025-26'}
  ];
  DB.teachers = [
    {id:'TC1', teacherId:'TCH001', name:'Rahul Sharma', password:'teach123', status:'Active'},
    {id:'TC2', teacherId:'TCH002', name:'Priya Nair', password:'teach123', status:'Active'}
  ];
  DB.subjects = [
    {id:'SU1', code:'MCOM-FM01', name:'Financial Management', semester:2, teacherId:'TC1', classId:'CL2'},
    {id:'SU2', code:'MCOM-CA02', name:'Cost Accounting', semester:2, teacherId:'TC1', classId:'CL2'},
    {id:'SU3', code:'MCOM-BS03', name:'Business Statistics', semester:2, teacherId:'TC2', classId:'CL2'},
    {id:'SU4', code:'MCOM-EC04', name:'Economics', semester:2, teacherId:'TC2', classId:'CL2'},
    {id:'SU5', code:'MCOM-FM01A', name:'Financial Management', semester:1, teacherId:'TC1', classId:'CL1'},
    {id:'SU6', code:'MCOM-FM01C', name:'Financial Management', semester:2, teacherId:'TC1', classId:'CL3'}
  ];
  DB.students = [
    mkStudent('ST1','24MCOM001','Aditi Rao','2004-03-12','Female','CL2'),
    mkStudent('ST2','24MCOM002','Bharath Kumar','2003-11-02','Male','CL2'),
    mkStudent('ST3','24MCOM003','Chitra Menon','2004-01-22','Female','CL2'),
    mkStudent('ST4','24MCOM004','Dev Patel','2003-07-19','Male','CL2'),
    mkStudent('ST5','24MCOM005','Esha Iyer','2004-05-30','Female','CL2'),
    mkStudent('ST6','24MCOM006','Farhan Ali','2003-09-14','Male','CL2'),
    mkStudent('ST7','24MCOM007','Gayatri Nair','2004-02-08','Female','CL2'),
    mkStudent('ST8','24MCOM008','Harish Reddy','2003-12-25','Male','CL2'),
    mkStudent('ST9','25MCOM101','Ishaan Verma','2005-04-17','Male','CL1'),
    mkStudent('ST10','24MCOM201','Jyoti Singh','2004-06-09','Female','CL3')
  ];
  DB.attendance = [];
}

function generateAttendance(){
  let n = 1;
  DB.subjects.forEach((subject, sIdx)=>{
    const rates = subjectMonthRates[subject.id];
    const students = DB.students.filter(s=>s.classId===subject.classId);
    if(!rates || !students.length) return;
    monthsData.forEach(month=>{
      const base = rates[month.name];
      month.dates.forEach((date, dIdx)=>{
        students.forEach((stu, stuIdx)=>{
          const offset = (((stuIdx*7 + sIdx*13 + dIdx*3) % 11) - 5) / 100;
          const eff = Math.min(0.99, Math.max(0.5, base + offset));
          const status = Math.random() < eff ? 'P' : 'A';
          DB.attendance.push({id:'A'+(n++), studentId:stu.id, subjectId:subject.id, teacherId:subject.teacherId, date, period:(dIdx%4)+1, status});
        });
      });
    });
  });
}

/* ============================= HELPERS ============================= */
function $(sel, ctx){ return (ctx||document).querySelector(sel); }
function $all(sel, ctx){ return Array.from((ctx||document).querySelectorAll(sel)); }
function uid(prefix){ return prefix + Math.random().toString(36).slice(2,8); }

function statusFor(pct){
  if(pct>=85) return {cls:'success', label:'Good', color:'var(--success)'};
  if(pct>=75) return {cls:'warning', label:'Watch', color:'var(--warning)'};
  return {cls:'danger', label:'Critical', color:'var(--danger)'};
}

function subjectStatsForStudent(studentId, subjectId){
  const recs = DB.attendance.filter(a=>a.studentId===studentId && a.subjectId===subjectId);
  const held = recs.length;
  const present = recs.filter(r=>r.status==='P').length;
  const pct = held ? Math.round((present/held)*1000)/10 : 0;
  return {held, present, absent:held-present, pct};
}

function overallStatsForStudent(studentId){
  const student = DB.students.find(s=>s.id===studentId);
  const subjects = DB.subjects.filter(su=>su.classId===student.classId);
  let held=0, present=0;
  subjects.forEach(su=>{ const st=subjectStatsForStudent(studentId, su.id); held+=st.held; present+=st.present; });
  const pct = held ? Math.round((present/held)*1000)/10 : 0;
  return {held, present, absent:held-present, pct, subjects};
}

function monthlyTrendForStudent(studentId){
  const student = DB.students.find(s=>s.id===studentId);
  const subjectIds = DB.subjects.filter(su=>su.classId===student.classId).map(s=>s.id);
  return monthsData.map(m=>{
    const recs = DB.attendance.filter(a=>a.studentId===studentId && subjectIds.includes(a.subjectId) && a.date.startsWith(m.prefix));
    const held = recs.length;
    const present = recs.filter(r=>r.status==='P').length;
    return {name:m.name, pct: held ? Math.round((present/held)*100) : 0};
  });
}

function subjectOverallStats(subjectId){
  const recs = DB.attendance.filter(a=>a.subjectId===subjectId);
  const held = recs.length;
  const present = recs.filter(r=>r.status==='P').length;
  return {held, present, absent:held-present, pct: held ? Math.round((present/held)*1000)/10 : 0};
}

function classOverallStats(classId){
  const studentIds = DB.students.filter(s=>s.classId===classId).map(s=>s.id);
  const recs = DB.attendance.filter(a=>studentIds.includes(a.studentId));
  const held = recs.length;
  const present = recs.filter(r=>r.status==='P').length;
  return {held, present, pct: held ? Math.round((present/held)*1000)/10 : 0};
}

function overallStatsAll(){
  const held = DB.attendance.length;
  const present = DB.attendance.filter(r=>r.status==='P').length;
  return {held, present, pct: held ? Math.round((present/held)*1000)/10 : 0};
}

function barListHtml(items){
  return '<div class="bar-list">' + items.map(it=>{
    const info = statusFor(it.pct);
    return '<div class="bar-row"><span class="bar-label">'+it.label+'</span><div class="bar-track"><div class="bar-fill" style="width:'+it.pct+'%;background:'+info.color+'"></div></div><span class="bar-pct">'+it.pct+'%</span></div>';
  }).join('') + '</div>';
}

function donutHtml(pct, presentLabel, absentLabel){
  const info = statusFor(pct);
  return '<div class="donut-wrap">'
    + '<div class="donut" style="--pct:'+pct+';--dc:'+info.color+'"><span>'+pct+'%</span></div>'
    + '<div class="donut-legend">'
    + '<div><span class="dot" style="background:'+info.color+'"></span>'+presentLabel+'</div>'
    + '<div><span class="dot" style="background:var(--line)"></span>'+absentLabel+'</div>'
    + '</div></div>';
}

function trendHtml(trend){
  return '<div class="trend">' + trend.map(m=>
    '<div class="trend-col"><div class="trend-bar-wrap"><div class="trend-bar" style="height:'+m.pct+'px"></div></div><span class="trend-pct">'+m.pct+'%</span><span class="trend-label">'+m.name.slice(0,3)+'</span></div>'
  ).join('') + '</div>';
}

function monthMeta(prefix){
  const parts = prefix.split('-');
  return {year:Number(parts[0]), month:Number(parts[1])};
}

function daysInMonthList(prefix){
  const {year, month} = monthMeta(prefix);
  const numDays = new Date(year, month, 0).getDate();
  const out = [];
  for(let d=1; d<=numDays; d++) out.push(prefix+'-'+String(d).padStart(2,'0'));
  return out;
}

/* dayStatusFn(dateStr) should return null (no class held) or {held, present, pct} */
function calendarHtml(prefix, dayStatusFn, selectedDate){
  const {year, month} = monthMeta(prefix);
  const first = new Date(year, month-1, 1);
  const startWeekday = (first.getDay()+6)%7; // Monday = 0
  const dow = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  let cells = dow.map(d=>'<div class="cal-dow">'+d+'</div>').join('');
  for(let i=0;i<startWeekday;i++) cells += '<div class="cal-cell cal-empty"></div>';
  daysInMonthList(prefix).forEach(dateStr=>{
    const d = Number(dateStr.slice(-2));
    const info = dayStatusFn(dateStr);
    let cls = 'cal-cell';
    let label = '';
    if(info && info.held){
      const st = statusFor(info.pct);
      cls += ' cal-'+st.cls+' cal-clickable';
      if(dateStr===selectedDate) cls += ' cal-selected';
      label = '<span class="cal-pct">'+info.pct+'%</span>';
      cells += '<button type="button" class="'+cls+'" data-caldate="'+dateStr+'"><span class="cal-daynum">'+d+'</span>'+label+'</button>';
    } else {
      cells += '<div class="cal-cell cal-none"><span class="cal-daynum">'+d+'</span></div>';
    }
  });
  return '<div class="cal-legend">'
    + '<div><span class="dot" style="background:var(--success)"></span>Good (≥85%)</div>'
    + '<div><span class="dot" style="background:var(--warning)"></span>Watch (75–84%)</div>'
    + '<div><span class="dot" style="background:var(--danger)"></span>Critical (&lt;75%)</div>'
    + '<div><span class="dot" style="background:var(--line)"></span>No class held</div>'
    + '</div><div class="cal-grid" style="margin-top:12px;">' + cells + '</div>';
}

function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(cell=>{
    const s = String(cell===undefined || cell===null ? '' : cell);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

        renderTeacherMark(teacher);

        const existing = DB.attendance.find(a=>a.studentId===studentId && a.subjectId===state.markSubject && a.date===date && a.period===period);

        else{ const rec = {id:uid('A'), studentId, subjectId:state.markSubject, teacherId:teacher.id, date, period, status}; DB.attendance.push(rec); touched.push(rec); }
      });
      syncBulkUpsert('attendance', touched);
      $('#save-confirm').textContent = 'Saved '+Object.keys(state.markDraft).length+' records for '+date+'.';
    });
  }
}

function teacherDayStats(teacher, subjectFilter, dateStr){
  let recs = DB.attendance.filter(a=>a.teacherId===teacher.id && a.date===dateStr);
  if(subjectFilter!=='all') recs = recs.filter(a=>a.subjectId===subjectFilter);
  if(!recs.length) return null;
  const present = recs.filter(r=>r.status==='P').length;
  return {held:recs.length, present, absent:recs.length-present, pct:Math.round((present/recs.length)*1000)/10, recs};
}

function renderRecResults(teacher){
  let recs = DB.attendance.filter(a=>a.teacherId===teacher.id);
  if(state.recFilters.subject!=='all') recs = recs.filter(a=>a.subjectId===state.recFilters.subject);
  if(state.recFilters.month!=='all') recs = recs.filter(a=>a.date.startsWith(state.recFilters.month));
  if(state.recFilters.q){
    const q = state.recFilters.q.toLowerCase();
    recs = recs.filter(a=>{ const s=DB.students.find(st=>st.id===a.studentId); return s && (s.name.toLowerCase().includes(q) || s.regNo.toLowerCase().includes(q)); });
  }
  recs = recs.slice().sort((a,b)=> a.date<b.date?1:-1).slice(0,150);

  const html = '<table class="table"><thead><tr><th>Date</th><th>Period</th><th>Subject</th><th>Reg. no.</th><th>Student</th><th>Status</th><th></th></tr></thead><tbody>'
    + (recs.map(r=>{
        const s = DB.students.find(st=>st.id===r.studentId);
        const su = DB.subjects.find(x=>x.id===r.subjectId);
        return '<tr><td>'+r.date+'</td><td>'+r.period+'</td><td>'+su.name+'</td><td>'+s.regNo+'</td><td>'+s.name+'</td>'
          + '<td><span class="badge badge-'+(r.status==='P'?'success':'danger')+'">'+(r.status==='P'?'Present':'Absent')+'</span></td>'
          + '<td><button class="btn btn-ghost btn-sm" data-flip="'+r.id+'">Flip</button></td></tr>';
      }).join('') || '<tr><td colspan="7" class="empty">No records match these filters.</td></tr>')
    + '</tbody></table>';

  $('#rec-results-card').innerHTML = html;
  $all('[data-flip]').forEach(btn=>btn.addEventListener('click', ()=>{
    const rec = DB.attendance.find(a=>a.id===btn.dataset.flip);
    rec.status = rec.status==='P' ? 'A' : 'P';
    syncUpsert('attendance', rec);
    renderRecResults(teacher);
  }));
}

function subjectMonthMatrix(subjectId, monthPrefix){
  const subject = DB.subjects.find(s=>s.id===subjectId);
  const month = monthsData.find(m=>m.prefix===monthPrefix);
  const students = DB.students.filter(s=>s.classId===subject.classId);
  const rows = students.map(s=>{
    const cells = month.dates.map(d=>{
      const rec = DB.attendance.find(a=>a.studentId===s.id && a.subjectId===subjectId && a.date===d);
      return rec ? rec.status : '-';
    });
    const held = cells.filter(c=>c!=='-').length;
    const present = cells.filter(c=>c==='P').length;
    const pct = held ? Math.round((present/held)*1000)/10 : 0;
    return {student:s, cells, held, present, pct};
  });
  return {subject, month, rows};
}

function handleImportStudents(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const lines = reader.result.split(/\r?\n/).filter(l=>l.trim());
    const imported = [];
    lines.slice(1).forEach(line=>{
      const cols = line.split(',');
      if(cols.length<2) return;
      const regNo=cols[0], name=cols[1], dob=cols[2], gender=cols[3], course=cols[4], dept=cols[5], semester=cols[6], section=cols[7], email=cols[8], phone=cols[9], admissionYear=cols[10], status=cols[11];
      const cls = DB.classes.find(c=>c.course===course && String(c.semester)===String(semester) && c.section===section) || DB.classes[0];
      const rec = {
        id:uid('ST'), regNo:regNo||'', name:name||'Unnamed', dob:dob||'', gender:gender||'Other',
        course:cls.course, dept:dept||'Commerce', semester:cls.semester, section:cls.section,
        email:email||'', phone:phone||'', admissionYear:admissionYear||'', status:status||'Active', classId:cls.id
      };
      DB.students.push(rec);
      imported.push(rec);
    });
    syncBulkUpsert('students', imported);
    renderAdminStudents();
  };
  reader.readAsText(file);
}

function bindTeacherFormEvents(){

    if(!data.name || !data.teacherId){ alert('Teacher ID and name are required.'); return; }
    let teacherId, savedTeacher;
    if(state.teacherForm){ Object.assign(state.teacherForm, data); teacherId = state.teacherForm.id; savedTeacher = state.teacherForm; }
    else { const newT = Object.assign({id:uid('TC')}, data); DB.teachers.push(newT); teacherId = newT.id; savedTeacher = newT; }
    syncUpsert('teachers', savedTeacher);
    const touchedSubjects = [];
    DB.subjects.forEach(su=>{
      if(selected.includes(su.id)){ if(su.teacherId!==teacherId){ su.teacherId = teacherId; touchedSubjects.push(su); } }

    state.teacherForm = null;
    renderAdminTeachers();
  });

function filteredAdminAttendance(){
  const f = state.adminAttFilters;
  let recs = DB.attendance.slice();
  if(f.classId!=='all'){
    const ids = new Set(DB.students.filter(s=>s.classId===f.classId).map(s=>s.id));
    recs = recs.filter(a=>ids.has(a.studentId));
  }
  if(f.subjectId!=='all') recs = recs.filter(a=>a.subjectId===f.subjectId);
  if(f.teacherId!=='all') recs = recs.filter(a=>a.teacherId===f.teacherId);
  if(f.month!=='all') recs = recs.filter(a=>a.date.startsWith(f.month));
  if(f.q){
    const q = f.q.toLowerCase();
    recs = recs.filter(a=>{ const s=DB.students.find(st=>st.id===a.studentId); return s && (s.name.toLowerCase().includes(q) || s.regNo.toLowerCase().includes(q)); });
  }
  return recs.sort((a,b)=> a.date<b.date?1:-1);
}

function renderAdminAttResults(){
  const all = filteredAdminAttendance();
  const held = all.length;
  const present = all.filter(r=>r.status==='P').length;
  const pct = held ? Math.round((present/held)*1000)/10 : 0;
  const shown = all.slice(0, 150);

  const html = '<div class="card"><div class="sub" style="margin-bottom:12px;">'+held+' matching records · '+pct+'% present'+(held>150?' · showing first 150':'')+'</div>'
    + '<table class="table"><thead><tr><th>Date</th><th>Period</th><th>Reg. no.</th><th>Student</th><th>Subject</th><th>Teacher</th><th>Status</th><th></th></tr></thead><tbody>'
    + (shown.map(r=>{
        const s = DB.students.find(st=>st.id===r.studentId);
        const su = DB.subjects.find(x=>x.id===r.subjectId);
        const t = DB.teachers.find(x=>x.id===r.teacherId);
        return '<tr><td>'+r.date+'</td><td>'+r.period+'</td><td>'+(s?s.regNo:'—')+'</td><td>'+(s?s.name:'—')+'</td><td>'+(su?su.name:'—')+'</td><td>'+(t?t.name:'—')+'</td>'
          + '<td><span class="badge badge-'+(r.status==='P'?'success':'danger')+'">'+(r.status==='P'?'Present':'Absent')+'</span></td>'
          + '<td><button class="btn btn-ghost btn-sm" data-aflip="'+r.id+'">Flip</button> <button class="btn btn-ghost btn-sm" data-adel="'+r.id+'">Delete</button></td></tr>';
      }).join('') || '<tr><td colspan="8" class="empty">No records match these filters.</td></tr>')
    + '</tbody></table></div>';

  $('#att-results').innerHTML = html;
  $all('[data-aflip]').forEach(b=>b.addEventListener('click', ()=>{
    const rec = DB.attendance.find(a=>a.id===b.dataset.aflip);
    rec.status = rec.status==='P' ? 'A' : 'P';
    syncUpsert('attendance', rec);
    renderAdminAttResults();
  }));
  $all('[data-adel]').forEach(b=>b.addEventListener('click', ()=>{
    syncDelete('attendance', b.dataset.adel);
    DB.attendance = DB.attendance.filter(a=>a.id!==b.dataset.adel);
    renderAdminAttResults();
  }));
}

function exportAdminAttendance(){
  const recs = filteredAdminAttendance();

  const rows = recs.map(r=>{

    const su = DB.subjects.find(x=>x.id===r.subjectId);

    return [r.date, r.period, s?s.regNo:'', s?s.name:'', su?su.name:'', t?t.name:'', r.status==='P'?'Present':'Absent'];

/* --- Calendar --- */
function adminDayStats(classFilter, dateStr){
  let recs = DB.attendance.filter(a=>a.date===dateStr);
  if(classFilter!=='all'){
    const ids = new Set(DB.students.filter(s=>s.classId===classFilter).map(s=>s.id));
    recs = recs.filter(a=>ids.has(a.studentId));
  }
  if(!recs.length) return null;
  const present = recs.filter(r=>r.status==='P').length;
  return {held:recs.length, present, absent:recs.length-present, pct:Math.round((present/recs.length)*1000)/10, recs};
}

function renderAdminCalendar(){
  if(!state.adminCalMonth) state.adminCalMonth = monthsData[monthsData.length-1].prefix;
  const m = state.adminCalMonth;

  let html = '<div class="page-head"><div><h1>Calendar</h1><div class="sub">Day-by-day attendance across the institution.</div></div></div>';
  html += '<div class="card"><div class="cal-toolbar">'
    + '<div class="field" style="margin:0;min-width:180px;"><label>Month</label><select id="acal-month">' + monthsData.map(mo=>'<option value="'+mo.prefix+'" '+(mo.prefix===m?'selected':'')+'>'+mo.name+' 2026</option>').join('') + '</select></div>'
    + '<div class="field" style="margin:0;min-width:200px;"><label>Class</label><select id="acal-class"><option value="all">All classes</option>' + DB.classes.map(c=>'<option value="'+c.id+'" '+(state.adminCalClass===c.id?'selected':'')+'>'+c.course+' S'+c.semester+'-'+c.section+'</option>').join('') + '</select></div>'
    + '</div>'
    + calendarHtml(m, d=>adminDayStats(state.adminCalClass, d), state.adminCalDate)
    + '</div>';

  html += '<div class="card" id="acal-detail">' + adminCalDetailHtml(state.adminCalDate) + '</div>';

  $('#admin-content').innerHTML = html;

  $('#acal-month').addEventListener('change', e=>{ state.adminCalMonth=e.target.value; state.adminCalDate=null; renderAdminCalendar(); });
  $('#acal-class').addEventListener('change', e=>{ state.adminCalClass=e.target.value; state.adminCalDate=null; renderAdminCalendar(); });
  $all('[data-caldate]').forEach(btn=>btn.addEventListener('click', ()=>{
    state.adminCalDate = btn.dataset.caldate;
    renderAdminCalendar();
  }));

  function adminCalDetailHtml(dateStr){
    if(!dateStr) return '<h3>Select a day</h3><p class="sub">Click any coloured day above to see that day\'s attendance by class and subject.</p>';
    const day = adminDayStats(state.adminCalClass, dateStr);
    if(!day) return '<h3>'+dateStr+'</h3><p class="sub">No classes were held on this day.</p>';
    const bySubject = {};
    day.recs.forEach(r=>{
      bySubject[r.subjectId] = bySubject[r.subjectId] || {held:0, present:0};
      bySubject[r.subjectId].held++;
      if(r.status==='P') bySubject[r.subjectId].present++;
    });
    return '<h3>'+dateStr+' · '+day.present+' of '+day.held+' present ('+day.pct+'%)</h3>'
      + '<div class="cal-detail-list">' + Object.keys(bySubject).map(suId=>{
          const su = DB.subjects.find(x=>x.id===suId);
          const st = bySubject[suId];
          const pct = Math.round((st.present/st.held)*1000)/10;
          return '<div class="cal-detail-row"><span>'+(su?su.name:'—')+'</span><span>'+st.present+' / '+st.held+' · '+pct+'%</span></div>';
        }).join('') + '</div>';
  }
}

/* ============================= INIT ============================= */
document.addEventListener('DOMContentLoaded', initApp);

function initApp(){
  if(!BACKEND_ON){
    console.warn('No API_URL configured — running in local-only demo mode (data will not be shared between users/devices).');
    seedDB();
    generateAttendance();
    populateLoginSelects();
    bindLoginEvents();
    return;
  }
  apiGetAll().then(res=>{
    if(res && res.ok && res.data && res.data.students && res.data.students.length){
      DB.classes = res.data.classes || [];
      DB.teachers = res.data.teachers || [];
      DB.subjects = res.data.subjects || [];
      DB.students = res.data.students || [];
      DB.attendance = res.data.attendance || [];
      populateLoginSelects();
      bindLoginEvents();
    } else {
      // Sheet is empty (first run) — seed demo data locally, then push it to the sheet once.
      seedDB();
      generateAttendance();
      syncSeedAll().finally(()=>{
        populateLoginSelects();
        bindLoginEvents();
      });
    }
  }).catch(err=>{
    console.error('Could not reach the shared backend, falling back to local demo data.', err);
    seedDB();
    generateAttendance();
    populateLoginSelects();
    bindLoginEvents();
  });
}

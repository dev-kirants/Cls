/* ============================= IMPORT OLD WORKBOOK (.xlsx) ============================= */
/* Reads a workbook downloaded from the old Google Sheet (tabs: classes, teachers, subjects,
   students, attendance; timetable/holidays/sessions optional) and loads it into the app. */
const IMPORT_SCHEMA = {
  classes:['id','course','semester','section','year'],
  teachers:['id','teacherId','name','password','passHash','status','email','phone'],
  subjects:['id','code','name','semester','teacherId','classId'],
  students:['id','regNo','name','dob','gender','course','dept','semester','section','email','phone','admissionYear','status','classId'],
  attendance:['id','studentId','subjectId','teacherId','date','period','status'],
  timetable:['id','classId','day','period','subjectId'],
  holidays:['id','date','name','type'],
  sessions:['id','subjectId','classId','teacherId','date','period','topics','files'],
  settings:['id','value']
};
const IMPORT_NUM = {semester:1, period:1};
function normImportCell(k, v){
  if(v === null || v === undefined || v === '') return IMPORT_NUM[k] ? null : (k === 'files' ? [] : '');
  if(v instanceof Date){ return new Date(v.getTime() - v.getTimezoneOffset()*60000).toISOString().slice(0,10); }
  if(IMPORT_NUM[k]){ const n = Number(v); return isNaN(n) ? null : n; }
  if(k === 'files'){ try{ return JSON.parse(v); }catch(e){ return []; } }
  return String(v).trim();
}
function workbookToTables(wb){
  const tables = {}; let found = 0;
  SYNC_TABLES.forEach(t=>{
    const name = wb.SheetNames.find(n=>n.trim().toLowerCase() === t);
    if(!name){ tables[t] = []; return; }
    found++;
    const raw = XLSX.utils.sheet_to_json(wb.Sheets[name], {defval:'', raw:true});
    tables[t] = raw.map(r=>{
      const lower = {}; Object.keys(r).forEach(h=>{ lower[h.trim().toLowerCase()] = r[h]; });
      const o = {};
      IMPORT_SCHEMA[t].forEach(k=>{ o[k] = normImportCell(k, lower[k.toLowerCase()]); });
      return o;
    }).filter(o=>o.id);
  });
  return {tables, found};
}
function handleOldWorkbook(e){
  const input = e.target, file = input.files && input.files[0];
  if(!file) return;
  const st = $('#import-status');
  if(typeof XLSX === 'undefined'){ alert('Excel support failed to load — check your internet connection and reload the page.'); return; }
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const wb = XLSX.read(reader.result, {type:'array', cellDates:true});
      const res = workbookToTables(wb);
      if(!res.found){ alert('None of the expected tabs (classes, teachers, subjects, students, attendance) were found in that file.'); return; }
      const summary = SYNC_TABLES.map(t=> t+': '+res.tables[t].length+' rows').join('\n');
      if(!confirm('Replace ALL data currently in this app with the contents of this file?\n\n'+summary)) return;
      SYNC_TABLES.forEach(t=>{ if(t==='settings' && !res.tables[t].length) return; DB[t] = res.tables[t]; });
      applyPeriodConfig(); applyBrand();
      if(BACKEND_ON()){
        st.textContent = 'Imported. Uploading to Firebase…';
        await syncSeedAll();
        st.textContent = 'Imported and uploaded to Firebase.';
      } else {
        st.textContent = 'Imported into this session. Now enter your Firebase details above and click Save & test connection to upload it.';
      }
    }catch(err){ alert('Could not read that file: '+err.message); }
    input.value = '';
  };
  reader.readAsArrayBuffer(file);
}

    const regNo=String(cols[0]||'').trim(), name=String(cols[1]||'').trim();
    if(!regNo && !name) return;
    const dob=cols[2]||'', gender=cols[3]||'', course=cols[4]||'', dept=cols[5]||'', semester=cols[6], section=cols[7]||'', email=cols[8]||'', phone=cols[9]||'', admissionYear=cols[10]||'', status=cols[11]||'';
    const cls = DB.classes.find(c=>c.course===course && String(c.semester)===String(semester) && c.section===section) || DB.classes[0];
    if(!cls) return;
    const rec = {
      id:uid('ST'), regNo:regNo||'', name:name||'Unnamed', dob:String(dob||''), gender:gender||'Other',
      course:cls.course, dept:dept||'Commerce', semester:cls.semester, section:cls.section,
      email:email||'', phone:String(phone||''), admissionYear:String(admissionYear||''), status:status||'Active', classId:cls.id
    };
    DB.students.push(rec);
    imported.push(rec);
  });
  syncBulkUpsert('students', imported);
  renderAdminStudents();
  alert('Imported '+imported.length+' student'+(imported.length===1?'':'s')+'.');
}

function handleImportStudents(e){
  const file = e.target.files[0];
  if(!file) return;
  const isExcel = /\.(xlsx|xls)$/i.test(file.name);
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      if(isExcel){
        if(typeof XLSX === 'undefined'){ alert('Excel support failed to load — try a CSV file instead.'); return; }
        const wb = XLSX.read(reader.result, {type:'binary'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:''});
        importStudentRows(rows.slice(1));
      } else {
        const lines = reader.result.split(/\r?\n/).filter(l=>l.trim());
        const rows = lines.slice(1).map(line=>line.split(',').map(c=>c.trim().replace(/^"|"$/g,'')));
        importStudentRows(rows);
      }
    }catch(err){
      alert('Could not read that file: '+err.message);
    }
  };
  if(isExcel) reader.readAsBinaryString(file); else reader.readAsText(file);
  e.target.value = '';
}

function filteredAdminAttendance(){
  const f = state.adminAttFilters;
  let recs = DB.attendance.slice();
  if(f.classId!=='all'){
    const ids = new Set(DB.students.filter(s=>s.classId===f.classId).map(s=>s.id));
    recs = recs.filter(a=>ids.has(a.studentId));
  }
  if(f.subjectId!=='all') recs = recs.filter(a=>a.subjectId===f.subjectId);
  if(f.teacherId!=='all') recs = recs.filter(a=>a.teacherId===f.teacherId);
  if(f.month!=='all') recs = recs.filter(a=>a.date.startsWith(f.month));
  if(f.from) recs = recs.filter(a=>a.date>=f.from);
  if(f.to) recs = recs.filter(a=>a.date<=f.to);
  if(f.status) recs = recs.filter(a=>a.status===f.status);
  if(f.q){
    const q = f.q.toLowerCase();
    recs = recs.filter(a=>{ const s=DB.students.find(st=>st.id===a.studentId); return s && (s.name.toLowerCase().includes(q) || s.regNo.toLowerCase().includes(q)); });
  }
  return recs.sort((a,b)=> a.date<b.date?1:-1);
}

/* --- Calendar --- */
function adminDayStats(classFilter, dateStr){
  let recs = DB.attendance.filter(a=>a.date===dateStr);
  if(classFilter!=='all'){
    const ids = new Set(DB.students.filter(s=>s.classId===classFilter).map(s=>s.id));
    recs = recs.filter(a=>ids.has(a.studentId));
  }
  if(!recs.length) return null;
  const present = recs.filter(r=>r.status==='P').length;
  return {held:recs.length, present, absent:recs.length-present, pct:Math.round((present/recs.length)*1000)/10, recs};
}

function renderAdminCalendar(){

const DASH = '<span style="color:var(--muted)">—</span>';
function clsLabel(c){ return c ? c.course+' S'+c.semester+'-'+c.section : '—'; }

/* ============================= E-MAIL (attendance confirmations + admin login codes) ============================= */
/* The app queues each email as a document in the Firestore "mail" collection. The Firebase extension
   "Trigger Email from Firestore" (see the setup card on Admin > Admin Account) actually delivers it by SMTP. */
function collegeName(){ return (getSetting('brand',{}).name||'').trim() || 'Attendance Ledger'; }
function mailFields(m){
  const S=v=>({stringValue:String(v)});
  return {
    to:S(m.to),
    message:{mapValue:{fields:{subject:S(m.subject), text:S(m.text), html:S(m.html)}}},
    kind:S(m.kind), by:S(m.by), teacherId:S(m.teacherId||''), createdAt:{integerValue:String(Date.now())}
  };
}
async function queueMail(id, m, once){
  const c=getSupabaseCfg();
  const w={update:{name:fsRoot(c)+'/mail/'+id, fields:mailFields(m)}};
  if(once) w.currentDocument={exists:false};
  try{ await fsPost(c,':commit',{writes:[w]}); return 'queued'; }
  catch(e){ if(once && /HTTP 409/.test(e.message)) return 'duplicate'; throw e; }
}
function mailWrap(title, inner){
  return '<div style="font-family:Arial,sans-serif;max-width:560px;color:#0B2530;"><h2 style="color:#0E5A6B;margin:0 0 10px;">'+escapeHtml(title)+'</h2>'+inner
    +'<p style="color:#5C7077;font-size:12px;margin-top:22px;">'+escapeHtml(collegeName())+' · automated message</p></div>';
}

/* Sent to the subject's teacher as soon as attendance is saved. */
function attendanceMarkedMail(owner, marker, subject, cls, date, period, recs, isUpdate){
  const present=recs.filter(r=>r.status==='P').length, total=recs.length, absent=total-present;
  const pct=total?Math.round((present/total)*1000)/10:0;
  const abs=recs.filter(r=>r.status==='A').map(r=>DB.students.find(s=>s.id===r.studentId)).filter(Boolean).sort((a,b)=>String(a.regNo).localeCompare(String(b.regNo)));
  const shown=abs.slice(0,100), more=abs.length-shown.length;
  const where=clsLabel(cls), time=PERIOD_TIMES[period]||'';
  const verb=isUpdate?'updated':'marked';
  const subjectLine='Attendance '+verb+': '+subject.name+' · '+where+' · '+date+' (Period '+period+')';
  const td='padding:6px 10px;border-bottom:1px solid #CCDADD;';
  const absRows=shown.map(s=>'<tr><td style="'+td+'">'+escapeHtml(s.regNo)+'</td><td style="'+td+'">'+escapeHtml(s.name)+'</td></tr>').join('');
  const text='Hello '+owner.name+',\n\nAttendance was '+verb+' for '+subject.name+' ('+where+') on '+date+', Period '+period+(time?' ('+time+')':'')+'.\n'
    +'Marked by: '+marker.name+'\nPresent: '+present+'  Absent: '+absent+'  Total: '+total+'  ('+pct+'% present)\n'
    +(abs.length?'\nAbsent students:\n'+shown.map(s=>s.regNo+' - '+s.name).join('\n')+(more>0?'\n...and '+more+' more':'')+'\n':'\nNo absentees.\n')
    +'\n'+collegeName();
  const html=mailWrap('Attendance '+verb,
    '<p>Hello '+escapeHtml(owner.name)+',</p>'
    +'<p><b>'+escapeHtml(subject.name)+'</b> · '+escapeHtml(where)+'<br>'+escapeHtml(date)+' · Period '+period+(time?' ('+escapeHtml(time)+')':'')+'<br>Marked by '+escapeHtml(marker.name)+'</p>'
    +'<p style="font-size:15px;"><b style="color:#2F6F4E;">Present '+present+'</b> &nbsp; <b style="color:#A33636;">Absent '+absent+'</b> &nbsp; Total '+total+' &nbsp; ('+pct+'% present)</p>'
    +(abs.length?'<table style="border-collapse:collapse;font-size:14px;"><tr><th align="left" style="padding:6px 10px;">Reg. no.</th><th align="left" style="padding:6px 10px;">Absent student</th></tr>'+absRows+'</table>'+(more>0?'<p>…and '+more+' more.</p>':''):'<p>No absentees.</p>'));
  return {subject:subjectLine, text, html};
}
/* returns {status:'queued'|'noemail'|'failed', to} */
async function mailAttendanceMarked(marker, subject, date, period, isUpdate){
  const owner=DB.teachers.find(t=>t.id===subject.teacherId) || marker;
  const to=normEmail(owner.email);
  if(!validEmail(to)) return {status:'noemail', to:''};
  if(!BACKEND_ON()) return {status:'failed', to};
  const cls=DB.classes.find(c=>c.id===subject.classId);
  const recs=DB.attendance.filter(a=>a.subjectId===subject.id && a.date===date && a.period===period);
  if(!recs.length) return {status:'failed', to};
  try{
    const m=attendanceMarkedMail(owner, marker, subject, cls, date, period, recs, isUpdate);
    await queueMail(uid('att_'),{to,subject:m.subject,text:m.text,html:m.html,kind:'attendance',by:'attendance',teacherId:owner.id},false);
    return {status:'queued', to};
  }catch(e){ return {status:'failed', to}; }
}

/* ---- sent-mail log (shown on Admin > Admin Account) ---- */
const MAIL_UI = {log:[], logMsg:'Loading…'};
function decMailDoc(d){
  const f=d.fields||{}, g=k=>f[k]&&('stringValue' in f[k])?f[k].stringValue:'';
  const msg=f.message&&f.message.mapValue?f.message.mapValue.fields||{}:{};
  const del=f.delivery&&f.delivery.mapValue?f.delivery.mapValue.fields||{}:{};
  let to=''; if(f.to){ to=('stringValue' in f.to)?f.to.stringValue:((f.to.arrayValue&&f.to.arrayValue.values)||[]).map(x=>x.stringValue).join(', '); }
  return {to, subject:msg.subject?msg.subject.stringValue:'', by:g('by'), createdAt:f.createdAt?Number(f.createdAt.integerValue):0,
    state:del.state?del.state.stringValue:'', error:del.error&&del.error.stringValue?del.error.stringValue:''};
}
async function loadMailLog(){
  if(!BACKEND_ON()){ MAIL_UI.log=[]; MAIL_UI.logMsg='Connect the database in Settings to see sent emails.'; return; }
  try{
    const c=getSupabaseCfg();
    const items=await fsPost(c,':runQuery',{structuredQuery:{from:[{collectionId:'mail'}], orderBy:[{field:{fieldPath:'createdAt'},direction:'DESCENDING'}], limit:25}});
    MAIL_UI.log=items.filter(i=>i.document).map(i=>decMailDoc(i.document));
    MAIL_UI.logMsg=MAIL_UI.log.length?'':'No emails yet.';
  }catch(e){ MAIL_UI.log=[]; MAIL_UI.logMsg='Could not load the email log ('+e.message+'). Publish the updated Firestore rules (Settings) so the "mail" collection is allowed.'; }
}
function mailLogHtml(){
  if(!MAIL_UI.log.length) return '<p class="sub">'+escapeHtml(MAIL_UI.logMsg)+'</p>';
  return '<div style="overflow-x:auto;"><table class="table"><thead><tr><th>When</th><th>To</th><th>Subject</th><th>Type</th><th>Status</th></tr></thead><tbody>'
    + MAIL_UI.log.map(m=>{
      const s=m.state==='SUCCESS'?['success','Delivered']:m.state==='ERROR'?['danger','Failed']:['warning','Queued'];
      return '<tr><td>'+(m.createdAt?escapeHtml(new Date(m.createdAt).toLocaleString()):DASH)+'</td><td>'+escapeHtml(m.to)+'</td><td>'+escapeHtml(m.subject)+'</td><td>'+(m.by==='system'?'Login / security':'Attendance')+'</td><td><span class="badge badge-'+s[0]+'" '+(m.error?'title="'+escapeHtml(m.error)+'"':'')+'>'+s[1]+'</span></td></tr>';
    }).join('')+'</tbody></table></div>';
}

/* ============================= ADMIN > MAIL REMINDER ============================= */
/* Manual e-mail reminders: pick who (teachers / students / everyone), what (today's or tomorrow's classes, or a custom
   message) and tick individual recipients. Mails are queued in the Firestore "mail" collection (same delivery path as
   attendance mails). Every mail sent is listed below, where it can be deleted or printed. */
const MR = {who:'teachers', what:'today', cls:'all', q:'', sel:new Set(), init:false,
  sub:'', body:'Dear {name},\n\n', note:'', extra:'', view:'all', log:[], msg:'Loading…', loaded:false};
function mrDay(offset){
  const d=new Date(); d.setDate(d.getDate()+offset);
  return {date:d.toLocaleDateString('en-CA'), day:JS_DAY_TO_NAME[d.getDay()],
    label:d.toLocaleDateString(undefined,{weekday:'long', day:'numeric', month:'short', year:'numeric'})};
}
function mrInfo(){ return MR.what==='custom' ? null : mrDay(MR.what==='tomorrow'?1:0); }
function mrOffReason(info){
  if(!info) return '';
  if(WEEKDAYS.indexOf(info.day)===-1) return 'Sunday';
  const h=holidaysOn(info.date)[0]; return h ? 'Holiday: '+h.name : '';
}
function mrBodyHtml(text){ return '<p>'+escapeHtml(text).replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>')+'</p>'; }
function mrFill(tpl, vars){ return String(tpl).replace(/\{(name|regNo|pct)\}/g,(m,k)=>vars[k]!==undefined?vars[k]:m); }

/* ---- people ---- */
function mrClassLines(entries, role){
  return entries.map(tt=>{
    const su=DB.subjects.find(x=>x.id===tt.subjectId), c=DB.classes.find(x=>x.id===tt.classId);
    const what=su?su.name:(tt.text||'Class');
    const tail=role==='teacher' ? clsLabel(c) : (su?teacherName(su):'');
    return 'P'+tt.period+(PERIOD_TIMES[tt.period]?' ('+PERIOD_TIMES[tt.period]+')':'')+' · '+what+(tail?' · '+tail:'');
  });
}
function mrPeople(ignoreSearch){
  const info=mrInfo(), off=mrOffReason(info), out=[], q=ignoreSearch?'':MR.q.trim().toLowerCase();
  const add=(key,role,name,email,regNo,entries,extra)=>{
    const e=normEmail(email), valid=validEmail(e);
    let dis='';
    if(!valid) dis='no email on file';
    else if(info && !entries.length) dis=off||'no classes';
    if(q && !(name.toLowerCase().includes(q)||e.includes(q)||String(regNo||'').toLowerCase().includes(q))) return;
    out.push({key,role,name,email:e,regNo:regNo||'',entries,dis,extra:extra||''});
  };
  if(MR.who!=='students') DB.teachers.filter(t=>t.status!=='Inactive').forEach(t=>
    add('t:'+t.id,'teacher',t.name,t.email,'',info&&!off?teacherClassesOn(t,info.day):[], 'Teacher'));
  if(MR.who!=='teachers') DB.students.filter(s=>s.status!=='Inactive' && (MR.cls==='all'||s.classId===MR.cls))
    .slice().sort((a,b)=>String(a.regNo).localeCompare(String(b.regNo))).forEach(s=>
    add('s:'+s.id,'student',s.name,s.email,s.regNo,info&&!off?DB.timetable.filter(tt=>tt.classId===s.classId&&tt.day===info.day).sort((a,b)=>a.period-b.period):[],
      'Student · '+s.regNo+' · '+clsLabel(DB.classes.find(c=>c.id===s.classId))));
  return out;
}
function mrResetSel(){ MR.sel=new Set(mrPeople(true).filter(p=>!p.dis).map(p=>p.key)); }
function mrChosen(){ return mrPeople(true).filter(p=>!p.dis && MR.sel.has(p.key)); }
function mrExtraList(){ return MR.what==='custom' ? MR.extra.split(/[\s,;]+/).map(normEmail).filter(validEmail) : []; }

function mrPeopleHtml(){
  const ppl=mrPeople(false);

  const row=p=>'<label class="mr-row '+(p.dis?'dis':'')+'"><input type="checkbox" data-mrp="'+escapeHtml(p.key)+'" '+(p.dis?'disabled':(MR.sel.has(p.key)?'checked':''))+'/>'
    +'<b>'+escapeHtml(p.name)+'</b><span>'+escapeHtml(p.extra)+' · '+(p.dis?escapeHtml(p.dis):escapeHtml(p.email))+(!p.dis&&mrInfo()?' · '+p.entries.length+' class'+(p.entries.length===1?'':'es'):'')+'</span></label>';

function mrMailFor(p){

  const when=MR.what==='tomorrow'?'tomorrow':'today';
  return {subject:'Class reminder — '+when+' ('+info.label+')',
    text:'Hello '+p.name+',\n\nYour classes for '+when+' ('+info.label+'):\n'+mrClassLines(p.entries,p.role).join('\n')+(MR.note.trim()?'\n\n'+MR.note.trim():'')+'\n\nRegards,\n'+collegeName()};
}
function mrUpdateCount(){

function mrRefreshPeople(){ const b=$('#mr-people'); if(!b) return; b.innerHTML=mrPeopleHtml(); mrBindPeople(); mrUpdateCount(); }
function mrBindPeople(){

/* ---- sent-mail list (load / delete / print) ---- */
async function mrLoad(){
  if(!BACKEND_ON()){ MR.log=[]; MR.msg='Connect the database in Settings to send and see mails.'; return; }
  try{
    const c=getSupabaseCfg();
    const items=await fsPost(c,':runQuery',{structuredQuery:{from:[{collectionId:'mail'}], orderBy:[{field:{fieldPath:'createdAt'},direction:'DESCENDING'}], limit:300}});
    MR.log=items.filter(i=>i.document).map(i=>{ const m=decMailDoc(i.document); m.id=i.document.name.split('/').pop();
      const k=i.document.fields&&i.document.fields.kind; m.kind=k&&k.stringValue?k.stringValue:''; return m; })
      .filter(m=>m.kind.indexOf('reminder-')===0);
    MR.msg='';
  }catch(e){ MR.log=[]; MR.msg='Could not load the mail list ('+e.message+'). Publish the updated Firestore rules (Settings) so the "mail" collection is allowed.'; }
}
const MR_VIEWS=[['all','All'],['teachers','Teachers'],['students','Students'],['custom','Other']];
function mrRows(){ return MR.view==='all' ? MR.log : MR.log.filter(m=>m.kind==='reminder-'+MR.view); }
function mrListTable(){
  const rows=mrRows();
  if(!rows.length) return '<p class="sub">'+escapeHtml(MR.msg||'No mails sent yet.')+'</p>';
  const allOn=rows.every(m=>MR.lsel.has(m.id));
  return '<div style="overflow-x:auto;"><table class="table"><thead><tr><th style="width:34px;"><input type="checkbox" id="mr-all" '+(allOn?'checked':'')+' aria-label="Select all"/></th><th>When</th><th>To</th><th>Subject</th><th>Status</th></tr></thead><tbody>'
    + rows.map(m=>{
      const s=m.state==='SUCCESS'?['success','Delivered']:m.state==='ERROR'?['danger','Failed']:['warning','Queued'];
      return '<tr><td><input type="checkbox" data-mrsel="'+escapeHtml(m.id)+'" '+(MR.lsel.has(m.id)?'checked':'')+'/></td><td>'+(m.createdAt?escapeHtml(new Date(m.createdAt).toLocaleString()):DASH)+'</td><td>'+escapeHtml(m.to)+'</td><td>'+escapeHtml(m.subject)+'</td><td><span class="badge badge-'+s[0]+'" '+(m.error?'title="'+escapeHtml(m.error)+'"':'')+'>'+s[1]+'</span></td></tr>';
    }).join('')+'</tbody></table></div>';
}
MR.lsel=new Set();
function mrRenderListCard(){
  const host=$('#mr-listcard'); if(!host) return;
  const rows=mrRows(), k=[...MR.lsel].filter(id=>rows.some(m=>m.id===id)).length;
  host.innerHTML='<h3>Sent mail list <span class="muted" style="font-weight:400;">('+rows.length+')</span></h3>'
    +'<div style="margin:10px 0 4px;">'+MR_VIEWS.map(v=>'<button class="mr-chip '+(MR.view===v[0]?'on':'')+'" data-mrview="'+v[0]+'">'+v[1]+'</button>').join('')+'</div>'
    +'<div class="btn-row" style="margin:6px 0 10px;">'
    +'<button class="btn btn-ghost btn-sm" id="mr-print" '+(rows.length?'':'disabled')+'>🖨 Print list</button>'
    +'<button class="btn btn-danger btn-sm" id="mr-del-sel" '+(k?'':'disabled')+'>Delete selected ('+k+')</button>'
    +'<button class="btn btn-danger btn-sm" id="mr-del-all" '+(rows.length?'':'disabled')+'>Delete entire list</button>'
    +'<button class="btn btn-ghost btn-sm" id="mr-refresh">Refresh</button></div>'+mrListTable();
  $all('[data-mrview]').forEach(b=>b.addEventListener('click',()=>{ MR.view=b.dataset.mrview; mrRenderListCard(); }));
  const all=$('#mr-all'); if(all) all.addEventListener('change',e=>{ rows.forEach(m=>e.target.checked?MR.lsel.add(m.id):MR.lsel.delete(m.id)); mrRenderListCard(); });
  $all('[data-mrsel]').forEach(cb=>cb.addEventListener('change',()=>{ cb.checked?MR.lsel.add(cb.dataset.mrsel):MR.lsel.delete(cb.dataset.mrsel); mrRenderListCard(); }));
  $('#mr-print').addEventListener('click',mrPrint);
  $('#mr-refresh').addEventListener('click',async()=>{ await mrLoad(); mrRenderListCard(); });
  $('#mr-del-sel').addEventListener('click',()=>{ const ids=[...MR.lsel].filter(id=>rows.some(m=>m.id===id)); if(ids.length && confirm('Delete '+ids.length+' selected mail'+(ids.length>1?'s':'')+' from the list? This cannot be undone.')) mrDelete(ids); });
  $('#mr-del-all').addEventListener('click',()=>{ const ids=rows.map(m=>m.id); if(ids.length && confirm('Delete the entire list shown ('+ids.length+' mails)? This cannot be undone.\n\nTip: use Print list first if you want a copy.')) mrDelete(ids); });
}
async function mrDelete(ids){
  const c=getSupabaseCfg();
  try{
    for(let i=0;i<ids.length;i+=400) await fsPost(c,':commit',{writes:ids.slice(i,i+400).map(id=>({delete:fsRoot(c)+'/mail/'+id}))});
    MR.log=MR.log.filter(m=>!ids.includes(m.id)); ids.forEach(id=>MR.lsel.delete(id));
    showToast('Deleted', ids.length+' mail'+(ids.length>1?'s':'')+' removed from the list.');
  }catch(e){ alert('Could not delete ('+e.message+'). Check the database rules and connection.'); }
  mrRenderListCard();
}
function mrPrint(){
  const rows=mrRows(), label=MR_VIEWS.find(v=>v[0]===MR.view)[1];
  const td='padding:6px;border-bottom:1px solid #ccc;', th='padding:6px;text-align:left;border-bottom:2px solid #000;';
  const st=m=>m.state==='SUCCESS'?'Delivered':m.state==='ERROR'?'Failed':'Queued';
  printReport('<h2 style="margin:0 0 4px;">'+escapeHtml(collegeName())+'</h2><h3 style="margin:0 0 4px;">Mail reminder list — '+escapeHtml(label)+'</h3>'
    +'<p style="margin:0 0 12px;font-size:12px;">Printed '+escapeHtml(new Date().toLocaleString())+' · '+rows.length+' mail'+(rows.length===1?'':'s')+'</p>'
    +'<table style="width:100%;border-collapse:collapse;font-size:12px;"><thead><tr><th style="'+th+'">#</th><th style="'+th+'">When</th><th style="'+th+'">To</th><th style="'+th+'">Subject</th><th style="'+th+'">Status</th></tr></thead><tbody>'
    +rows.map((m,i)=>'<tr><td style="'+td+'">'+(i+1)+'</td><td style="'+td+'">'+escapeHtml(m.createdAt?new Date(m.createdAt).toLocaleString():'')+'</td><td style="'+td+'">'+escapeHtml(m.to)+'</td><td style="'+td+'">'+escapeHtml(m.subject)+'</td><td style="'+td+'">'+st(m)+'</td></tr>').join('')
    +'</tbody></table>');
}

/* ---- send ---- */
async function mrSend(){
  const msg=$('#mr-msg'), btn=$('#mr-send'), err=t=>{ msg.className='form-msg err'; msg.textContent=t; };
  if(!BACKEND_ON()) return err('Connect the database in Settings first.');
  const custom=MR.what==='custom';
  if(custom && !MR.sub.trim()) return err('Enter a subject.');
  if(custom && !MR.body.replace(/\{name\}/g,'').trim()) return err('Write a message.');
  const items=mrChosen().map(p=>{ const m=mrMailFor(p); return {to:p.email, subject:m.subject, text:m.text, kind:p.role==='teacher'?'reminder-teachers':'reminder-students'}; });
  mrExtraList().forEach(to=>items.push({to, subject:MR.sub.trim(), text:mrFill(MR.body,{name:'Sir/Madam'}), kind:'reminder-custom'}));
  if(!items.length) return err('Select at least one recipient.');
  if(!confirm('Send this reminder to '+items.length+' recipient'+(items.length>1?'s':'')+'?')) return;
  btn.disabled=true; let ok=0, fail=0;
  for(let i=0;i<items.length;i++){
    msg.className='form-msg'; msg.textContent='Sending '+(i+1)+' of '+items.length+'…';
    try{ await queueMail(uid('rem_'),{to:items[i].to,subject:items[i].subject,text:items[i].text,html:mailWrap(items[i].subject,mrBodyHtml(items[i].text)),kind:items[i].kind,by:'reminder'},false); ok++; }
    catch(e){ fail++; }
  }
  btn.disabled=false;
  await mrLoad(); mrRenderListCard();
  msg.className='form-msg '+(fail?'err':'ok'); msg.textContent=ok+' queued'+(fail?', '+fail+' failed (check database rules).':'. They are delivered within a minute.');
}

/* ============================= ADMIN ACCOUNT TAB ============================= */
function renderAdminAccount(){
  const A=adminAccount(), conn=BACKEND_ON();
  let html='<div class="page-head"><div><h1>Admin Account</h1><div class="sub">The single administrator login. Sign-in asks for your password and a code e-mailed to the admin address below.</div></div></div>';
  if(!A.email) html+='<div class="card"><p class="form-msg err" style="margin:0;"><b>No admin e-mail is set.</b> Until you add one below, admin sign-in is protected by the password only. Enter your admin e-mail, your current password, and verify it with the code we send.</p></div>';
  if(!conn) html+='<div class="card"><p class="form-msg err" style="margin:0;">Codes are sent by e-mail through the shared database. Connect it in Settings first.</p></div>';
  html+='<div class="card"><h3>Admin details</h3>'
    +'<p class="sub" style="margin:8px 0 12px;">Current admin e-mail: <b>'+(A.email?escapeHtml(A.email):'not set')+'</b>. Changing the e-mail or password needs your current password and a verification code (sent to the new address if the e-mail changes, otherwise to the current one).</p>'
    +'<div class="form-grid">'
    +'<div class="field"><label>Admin e-mail</label><input id="ac-email" type="email" maxlength="254" autocomplete="off" value="'+escapeHtml(A.email)+'"/></div>'
    +'<div class="field"><label>New password <span class="muted">(leave blank to keep)</span></label><input id="ac-new" type="password" autocomplete="new-password" minlength="8"/></div>'
    +'<div class="field"><label>Confirm new password</label><input id="ac-new2" type="password" autocomplete="new-password"/></div>'
    +'<div class="field"><label>Current password</label><input id="ac-cur" type="password" autocomplete="current-password"/></div>'
    +'</div><div class="btn-row"><button class="btn btn-primary" id="ac-save" '+(conn?'':'disabled')+'>Send verification code</button></div>'
    +'<div id="ac-otp" style="display:none;margin-top:14px;"><div class="field" style="max-width:260px;"><label>Enter the 6-digit code sent to <b id="ac-otp-to"></b></label><input id="ac-code" class="otp-input" inputmode="numeric" maxlength="6" placeholder="------"/></div>'
    +'<div class="btn-row"><button class="btn btn-primary" id="ac-confirm">Confirm &amp; save</button><button class="btn btn-ghost" id="ac-resend">Resend code</button><button class="btn btn-ghost" id="ac-cancel">Cancel</button></div></div>'
    +'<div class="form-msg" id="ac-msg" role="alert"></div></div>';
  html+='<div class="card"><div class="mark-toolbar"><h3>Recent emails</h3><button class="btn btn-ghost btn-sm" id="mr-refresh">Refresh</button></div><div id="mr-log">'+mailLogHtml()+'</div></div>';
  html+='<div class="card"><h3>One-time setup: email delivery</h3><p class="sub">This app queues each email (admin login codes and attendance confirmations to teachers) in your Firestore database; Firebase sends it. 1) In Firebase console open <b>Extensions</b> and install <b>Trigger Email from Firestore</b>. 2) Set the collection to <b>mail</b> and enter your SMTP details (for example a Gmail app password or any mail service). 3) In Settings, copy the updated rules (they include <b>mail</b>) into Firestore &gt; Rules and Publish. Until this is done, emails stay "Queued" and admin login codes will not arrive.</p></div>';
  $('#admin-content').innerHTML=html;

  const msg=(t,ok)=>{ const m=$('#ac-msg'); m.textContent=t; m.className='form-msg '+(ok?'ok':'err'); };
  let pending=null;
  const closeOtp=()=>{ otpDrop('acct'); pending=null; $('#ac-otp').style.display='none'; $('#ac-save').style.display=''; };
  $('#ac-save').addEventListener('click', async ()=>{
    if(lockLeft()>0){ msg('Too many wrong attempts. Try again in '+Math.ceil(lockLeft()/60000)+' min.'); return; }
    const email=normEmail($('#ac-email').value), np=$('#ac-new').value, np2=$('#ac-new2').value, cur=$('#ac-cur').value;
    if(!validEmail(email)){ msg('Enter a valid admin e-mail address.'); return; }
    if(np && np.length<8){ msg('New password must be at least 8 characters.'); return; }
    if(np && !(/[A-Za-z]/.test(np) && /\d/.test(np))){ msg('New password must contain at least one letter and one number.'); return; }
    if(np!==np2){ msg('The two new passwords do not match.'); return; }
    if(email===A.email && !np){ msg('Nothing to change.'); return; }
    if(!cur || (await hashPw(cur,'admin'))!==A.h){ failLogin(); msg('Current password is incorrect.'); $('#ac-cur').value=''; return; }
    okLogin();
    const dest=(email!==A.email || !A.email) ? email : A.email;
    $('#ac-save').disabled=true; msg('Sending code…',true);
    try{ await otpIssue('acct', dest, 'acct'); }
    catch(e){ msg('Could not send the code ('+e.message+'). Check the database rules and e-mail delivery setup.'); $('#ac-save').disabled=false; return; }
    pending={email, h: np ? await hashPw(np,'admin') : null};
    $('#ac-save').disabled=false; $('#ac-save').style.display='none';
    $('#ac-otp-to').textContent=maskEmail(dest); $('#ac-code').value=''; $('#ac-otp').style.display='block'; $('#ac-code').focus();
    msg('Code sent. It is valid for 5 minutes.',true);
  });
  $('#ac-resend').addEventListener('click', async ()=>{
    if(!pending) return;
    const dest=(pending.email!==A.email || !A.email) ? pending.email : A.email;
    try{ await otpIssue('acct', dest, 'acct'); msg('A new code was sent.',true); }catch(e){ msg('Could not resend ('+e.message+').'); }
  });
  $('#ac-cancel').addEventListener('click', ()=>{ closeOtp(); msg(''); });
  $('#ac-confirm').addEventListener('click', async ()=>{
    if(!pending) return;
    if(lockLeft()>0){ msg('Too many wrong attempts. Try again in '+Math.ceil(lockLeft()/60000)+' min.'); return; }
    const r=await otpCheck('acct', $('#ac-code').value);
    if(r.s==='expired'){ closeOtp(); msg('That code has expired. Start again.'); return; }
    if(r.s==='locked'){ failLogin(); closeOtp(); msg('Too many wrong codes. Start again.'); return; }
    if(r.s==='bad'){ failLogin(); msg('Incorrect code. '+r.left+' attempt'+(r.left===1?'':'s')+' left.'); $('#ac-code').value=''; return; }
    const oldEmail=A.email, changedPw=!!pending.h, changedEmail=pending.email!==A.email;
    setSetting('adminAcct',{user:A.user, email:pending.email, h:pending.h||A.h});
    if(oldEmail && validEmail(oldEmail)){      // security notice to the previous address
      const what=[changedEmail?'the admin e-mail':'', changedPw?'the admin password':''].filter(Boolean).join(' and ');
      queueMail(uid('sec_'),{to:oldEmail,subject:'Admin details changed',text:'Hello,\n\n'+what+' for the admin portal was just changed. If this was not you, act immediately.\n\n'+collegeName(),
        html:mailWrap('Admin details changed','<p>'+escapeHtml(what)+' for the admin portal was just changed.</p><p>If this was not you, act immediately.</p>'),kind:'security',by:'system'},false).catch(()=>{});
    }
    pending=null; renderAdminAccount(); const m=$('#ac-msg'); m.textContent='Admin details updated.'; m.className='form-msg ok';
  });
  $('#mr-refresh').addEventListener('click', async()=>{ await loadMailLog(); const el=$('#mr-log'); if(el) el.innerHTML=mailLogHtml(); });
  if(!MAIL_UI.log.length) loadMailLog().then(()=>{ const el=$('#mr-log'); if(el) el.innerHTML=mailLogHtml(); });
}

/* ============================= INIT ============================= */
function initApp(){
  const ready = ()=>{ applyPeriodConfig(); applyBrand(); populateLoginSelects(); bindLoginEvents(); };
  if(!BACKEND_ON()){ ready(); return; }          // no database configured: start empty
  getRev().then(r=>{ REV_SEEN=r||{}; }); setInterval(pollRev,5000); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) pollRev(); });
  apiGetAll().then(res=>{
    if(res && res.ok) SYNC_TABLES.forEach(t=>{ DB[t] = res.data[t] || []; });
  }).catch(err=>console.error(err)).finally(ready);
}
initApp();
</script>
<script>
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>

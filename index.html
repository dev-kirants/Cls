<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src https://firestore.googleapis.com; object-src 'none'; manifest-src 'self'; worker-src 'self'; frame-src blob:; media-src blob:; base-uri 'none'; form-action 'none'"/>
<meta name="referrer" content="no-referrer"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#083F4C"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Attendance"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" href="icons/icon-192.png"/>
<link rel="apple-touch-icon" href="icons/icon-192.png"/>
<title>Attendance Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<style>
  :root{
    --ink:#0B2530;
    --paper:#EAF1F2;
    --surface:#FFFFFF;
    --line:#CCDADD;
    --muted:#5C7077;
    --primary:#0E5A6B;
    --primary-dark:#083F4C;
    --primary-tint:#DDEFF1;
    --gold:#D4962A;
    --success:#2F6F4E;
    --success-tint:#E4EFE8;
    --warning:#B8860B;
    --warning-tint:#F7EDD6;
    --danger:#A33636;
    --danger-tint:#F5E1DF;
    --radius:4px;
    --font-serif:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
    --font-sans:'DM Sans', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:var(--font-sans); line-height:1.4;}
  h1,h2,h3{font-family:var(--font-serif); margin:0;}
  button, input, select{font-family:var(--font-sans);}
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible{outline:2px solid var(--primary); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }

  .view{display:none;}
  .view.active{display:block;}

  /* ---------- Login ---------- */
  .login-wrap{min-height:100vh; display:grid; grid-template-columns:1.1fr 1fr;}
  @media (max-width:860px){ .login-wrap{grid-template-columns:1fr;} }
  .login-hero{background:var(--ink); color:var(--paper); padding:64px 56px; display:flex; flex-direction:column; justify-content:center; gap:22px;}
  .login-hero .eyebrow{color:var(--gold); font-weight:600; font-size:0.85rem; letter-spacing:0.02em;}
  .login-hero h1{font-size:clamp(2.1rem,4vw,3.2rem); line-height:1.12; font-weight:600; max-width:11ch; color:#EAF6F7;}
  .login-hero p{color:#CFE3E6; max-width:42ch; line-height:1.65; font-size:1rem;}
  .ledger-mark{display:flex; flex-direction:column; gap:14px; margin-top:8px;}
  .ledger-row{display:flex; align-items:center; gap:12px;}
  .ledger-dot{width:13px; height:13px; border-radius:50%; border:2px solid #4B7C86; flex-shrink:0;}
  .ledger-dot.done{background:var(--gold); border-color:var(--gold);}
  .ledger-line{height:2px; background:rgba(255,255,255,0.16); flex:1;}
  .ledger-line.short{width:55%; flex:none;}

  .login-form-wrap{display:flex; align-items:center; justify-content:center; padding:48px 24px; background:var(--paper);}
  .login-card{width:100%; max-width:400px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:32px;}
  .role-tabs{display:flex; border-bottom:1px solid var(--line); margin-bottom:22px;}
  .role-tab{flex:1; padding:10px 4px; text-align:center; cursor:pointer; font-weight:600; font-size:0.9rem; color:var(--muted); background:none; border:none; border-bottom:2px solid transparent;}
  .role-tab.active{color:var(--primary); border-color:var(--primary);}
  .login-panel .field:last-of-type{margin-bottom:18px;}
  .otp-input{letter-spacing:.45em; text-align:center; font-size:1.25rem; font-weight:600;}
  .hint{font-size:0.78rem; color:var(--muted); margin-top:16px; text-align:center; line-height:1.5;}
  .field-error{font-size:0.8rem; color:var(--danger); background:var(--danger-tint); border:1px solid var(--danger); border-radius:var(--radius); padding:8px 10px; margin:-4px 0 14px;}

  /* ---------- Shared form / field styles ---------- */
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:0.82rem; color:var(--muted); margin-bottom:6px;}
  input, select{width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:var(--radius); font-size:0.92rem; background:var(--surface); color:var(--ink);}
  select[multiple]{padding:6px;}
  .form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:6px;}
  .form-row{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:12px;}
  .form-row .field{flex:1; min-width:170px; margin-bottom:0;}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 18px; border-radius:var(--radius); border:1px solid transparent; font-weight:600; font-size:0.88rem; cursor:pointer; transition:background-color .15s ease, border-color .15s ease, color .15s ease;}
  .btn-primary{background:var(--primary); color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-ghost{background:transparent; border-color:var(--line); color:var(--ink);}
  .btn-ghost:hover{background:var(--paper);}
  .btn-block{width:100%;}
  .btn-sm{padding:6px 12px; font-size:0.78rem;}
  .btn-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .file-btn{cursor:pointer;}

  /* ---------- Topbar ---------- */
  .topbar{display:none; align-items:center; justify-content:space-between; padding:14px 28px; background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;}
  .topbar .brand{font-family:var(--font-serif); font-weight:600; font-size:1.15rem; color:var(--primary);}
  .who-wrap{display:flex; align-items:center; gap:14px;}
  .who{font-size:0.85rem; color:var(--muted);}

  /* ---------- App shell ---------- */
  .app-shell{display:grid; grid-template-columns:220px 1fr; min-height:calc(100vh - 58px); align-items:start;}
  @media (max-width:760px){ .app-shell{grid-template-columns:1fr;} .sidebar{display:flex; overflow-x:auto; border-right:none; border-bottom:1px solid var(--line);} }
  .sidebar{background:var(--surface); border-right:1px solid var(--line); padding:20px 12px; position:sticky; top:58px;}
  .side-title{font-weight:600; padding:6px 12px; font-size:0.95rem;}
  .side-sub{color:var(--muted); font-size:0.76rem; padding:0 12px 14px;}
  .sidebar-link{display:block; width:100%; text-align:left; padding:10px 12px; border-radius:var(--radius); color:var(--muted); font-weight:500; font-size:0.88rem; background:none; border:none; cursor:pointer; margin-bottom:2px; white-space:nowrap;}
  .side-group{font-size:.7rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--gold); padding:14px 12px 6px; border-top:1px solid var(--line); margin-top:10px;}
  .sidebar-link.active{background:var(--primary-tint); color:var(--primary-dark); font-weight:600;}
  .sidebar-link:hover{background:var(--paper);}
  .main{padding:28px; max-width:1180px; margin:0 auto; width:100%;}

  /* ---------- Page bits ---------- */
  .page-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; gap:14px; flex-wrap:wrap;}
  .page-head h1{font-size:1.7rem;}
  .sub{color:var(--muted); font-size:0.88rem; margin-top:4px;}
  .notice{padding:12px 16px; border-radius:var(--radius); margin-bottom:18px; font-size:0.88rem;}
  .notice-warning{background:var(--warning-tint); color:#7a5b06; border:1px solid var(--warning);}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-bottom:18px;}
  .card h3{font-size:1.05rem; margin-bottom:14px;}

  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:18px;}
  .stat-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px;}
  .stat-card .num{font-family:var(--font-serif); font-size:1.7rem; font-weight:600;}
  .stat-card .label{font-size:0.78rem; color:var(--muted); margin-top:2px;}

  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:760px){ .grid-2{grid-template-columns:1fr;} }

  table.table{width:100%; border-collapse:collapse; font-size:0.88rem;}
  .table th{text-align:left; padding:10px 12px; border-bottom:2px solid var(--ink); font-weight:600; font-size:0.76rem; color:var(--muted); text-transform:none;}
  .table td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:middle;}
  .table tr:hover td{background:var(--paper);}
  .empty{text-align:center; color:var(--muted); padding:26px !important;}

  .badge{display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:100px; font-size:0.75rem; font-weight:600;}
  .badge-success{background:var(--success-tint); color:var(--success);}
  .badge-warning{background:var(--warning-tint); color:var(--warning);}
  .badge-danger{background:var(--danger-tint); color:var(--danger);}

  .bar-track{background:var(--line); height:8px; border-radius:4px; overflow:hidden; width:100%; min-width:60px;}
  .bar-fill{height:100%; border-radius:4px;}
  .pct-cell{display:flex; flex-direction:column; gap:4px; min-width:90px;}
  .pct-cell span{font-size:0.82rem; font-weight:600;}

  .bar-list{display:flex; flex-direction:column; gap:11px;}
  .bar-row{display:grid; grid-template-columns:150px 1fr 46px; align-items:center; gap:10px; font-size:0.83rem;}
  .bar-label{color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bar-pct{text-align:right; font-weight:600;}

  .donut-wrap{display:flex; align-items:center; gap:26px; flex-wrap:wrap;}
  .donut{width:150px; height:150px; border-radius:50%; position:relative; display:grid; place-items:center; background:conic-gradient(var(--dc) calc(var(--pct)*1%), var(--line) 0);}
  .donut::before{content:''; position:absolute; inset:16px; border-radius:50%; background:var(--surface);}
  .donut span{position:relative; z-index:1; font-family:var(--font-serif); font-size:1.35rem; font-weight:600;}
  .donut-legend div{display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:0.88rem;}
  .dot{width:10px; height:10px; border-radius:50%; display:inline-block;}

  .trend{display:flex; gap:18px; align-items:flex-end; height:150px; padding-top:10px;}
  .trend-col{display:flex; flex-direction:column; align-items:center; gap:6px; flex:1;}
  .trend-bar-wrap{height:100px; display:flex; align-items:flex-end; width:100%; justify-content:center;}
  .trend-bar{width:30px; border-radius:3px 3px 0 0; background:var(--primary);}
  .trend-pct{font-size:0.8rem; font-weight:600;}
  .trend-label{font-size:0.76rem; color:var(--muted);}

  .toggle-group{display:flex; gap:6px;}
  .toggle-btn{padding:6px 12px; border:1px solid var(--line); background:var(--surface); border-radius:var(--radius); cursor:pointer; font-size:0.78rem; font-weight:600; color:var(--muted); transition:background-color .15s ease, border-color .15s ease, color .15s ease;}
  .toggle-btn.active-present{background:var(--success-tint); border-color:var(--success); color:var(--success);}
  .toggle-btn.active-absent{background:var(--danger-tint); border-color:var(--danger); color:var(--danger);}
  .mark-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  .save-confirm{margin-left:12px; color:var(--success); font-size:0.84rem;}

  /* ---------- Calendar ---------- */
  .cal-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  .cal-legend{display:flex; gap:14px; flex-wrap:wrap; font-size:0.78rem; color:var(--muted);}
  .cal-legend div{display:flex; align-items:center; gap:6px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal-dow{text-align:center; font-size:0.72rem; font-weight:600; color:var(--muted); padding-bottom:4px;}
  .cal-cell{aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); font-family:var(--font-sans); cursor:default; padding:2px;}
  .cal-cell.cal-clickable{cursor:pointer;}
  .cal-cell.cal-clickable:hover{border-color:var(--primary);}
  .cal-cell.cal-selected{outline:2px solid var(--primary); outline-offset:-2px;}
  .cal-cell.cal-empty{border:none; background:transparent;}
  .cal-cell.cal-none{color:var(--muted); background:var(--paper);}
  .cal-cell.cal-success{background:var(--success-tint); border-color:var(--success);}
  .cal-cell.cal-warning{background:var(--warning-tint); border-color:var(--warning);}
  .cal-cell.cal-holiday{background:#E9E2F3; border-color:#6B4FA0; color:#3F2A6E;}
  .cal-cell.cal-event{background:#DCEAF7; border-color:#2F6FA3; color:#1D4A73;}
  .cal-hname{font-size:0.58rem; font-weight:600; line-height:1.1; text-align:center; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 2px;}
  .cal-hmark{position:absolute; top:3px; right:4px; width:7px; height:7px; border-radius:50%;}
  .cal-cell{position:relative;}
  .cal-cell.cal-danger{background:var(--danger-tint); border-color:var(--danger);}
  .cal-daynum{font-size:0.8rem; font-weight:600;}
  .cal-pct{font-size:0.66rem; font-weight:600;}
  .cal-detail-list{display:flex; flex-direction:column; gap:8px;}
  .cal-detail-row{display:flex; justify-content:space-between; align-items:center; padding:8px 12px; background:var(--paper); border-radius:var(--radius); font-size:0.85rem;}

  /* ---------- Today's classes (big buttons) ---------- */
  .today-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px;}
  .class-btn{display:flex; flex-direction:column; align-items:flex-start; gap:6px; text-align:left; padding:22px 20px; border-radius:10px; border:1px solid var(--line); background:var(--surface); cursor:pointer; min-height:120px; transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;}
  .class-btn:hover{border-color:var(--primary); box-shadow:0 4px 14px rgba(0,0,0,0.08); transform:translateY(-2px);}
  .class-btn .cb-time{font-size:0.76rem; font-weight:700; color:var(--gold); letter-spacing:0.03em; text-transform:uppercase;}
  .class-btn .cb-subject{font-family:var(--font-serif); font-size:1.25rem; font-weight:600; color:var(--ink); line-height:1.2;}
  .class-btn .cb-meta{font-size:0.82rem; color:var(--muted);}
  .class-btn.cb-done{background:var(--success-tint); border-color:var(--success);}
  .class-btn.cb-done .cb-time{color:var(--success);}

  /* ---------- Timetable grid ---------- */
  .tt-table{width:100%; border-collapse:collapse; font-size:0.84rem;}
  .tt-table th{background:var(--paper); padding:8px; border:1px solid var(--line); font-size:0.74rem; color:var(--muted);}
  .tt-table td{border:1px solid var(--line); padding:4px; vertical-align:top; min-width:120px;}
  .tt-table td select{font-size:0.78rem; padding:6px 8px;}
  .tt-cell-view{padding:10px 8px; min-height:44px; display:flex; flex-direction:column; gap:2px;}
  .tt-cell-view .tt-sub{font-weight:600; font-size:0.85rem;}
  .tt-cell-view .tt-teach{font-size:0.74rem; color:var(--muted);}
  .tt-period-label{font-weight:600; font-size:0.78rem;}
  .tt-period-time{font-size:0.7rem; color:var(--muted); font-weight:400;}
  .tt-empty-cell{color:var(--muted); font-size:0.78rem; text-align:center; padding:14px 4px;}

  /* ---------- Holidays ---------- */
  .holiday-row{display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border:1px solid var(--line); border-radius:var(--radius); margin-bottom:8px;}
  .holiday-date{font-family:var(--font-serif); font-weight:600; min-width:110px;}
  .holiday-name{flex:1; padding:0 14px;}

  /* ---------- Class notes / content ---------- */
  .session-card{border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:12px; background:var(--surface);}
  .session-card .sc-head{display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; margin-bottom:6px;}
  .session-card .sc-title{font-weight:600;}
  .session-card .sc-date{font-size:0.78rem; color:var(--muted);}
  .session-card .sc-topics{margin:8px 0; line-height:1.55; white-space:pre-wrap;}
  .file-chip-list{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
  .file-chip{display:inline-flex; align-items:center; gap:6px; background:var(--paper); border:1px solid var(--line); border-radius:100px; padding:5px 12px 5px 10px; font-size:0.78rem; text-decoration:none; color:var(--ink);}
  .file-chip:hover{border-color:var(--primary);}
  button.file-chip{cursor:pointer; font-family:var(--font-sans);}
  textarea{width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:var(--radius); font-size:0.92rem; font-family:var(--font-sans); resize:vertical; min-height:90px; background:var(--surface); color:var(--ink);}

  /* ---------- Settings ---------- */
  .status-pill{display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:100px; font-size:0.8rem; font-weight:600;}
  .status-connected{background:var(--success-tint); color:var(--success);}
  .status-disconnected{background:var(--danger-tint); color:var(--danger);}
  .sql-box{background:var(--ink); color:#DCEBEE; padding:16px; border-radius:var(--radius); font-family:monospace; font-size:0.76rem; white-space:pre; overflow-x:auto; max-height:320px; overflow-y:auto;}

  /* ---------- Print ---------- */

  /* ---------- File viewer popup ---------- */
  .fv-backdrop{position:fixed; inset:0; background:rgba(11,37,48,.62); display:none; align-items:center; justify-content:center; padding:20px; z-index:1000;}
  .fv-backdrop.open{display:flex;}
  .fv-modal{background:var(--surface); border-radius:var(--radius); width:min(960px,100%); height:min(86vh,760px); display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,.35); overflow:hidden;}
  .fv-head{display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line);}
  .fv-title{font-family:var(--font-serif); font-weight:600; font-size:1rem; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .fv-meta{font-size:.75rem; color:var(--muted); white-space:nowrap;}
  .fv-body{flex:1; overflow:auto; background:var(--paper); display:flex; align-items:center; justify-content:center; min-height:0;}
  .fv-body img{max-width:100%; max-height:100%; object-fit:contain;}
  .fv-body iframe{width:100%; height:100%; border:0; background:#fff;}
  .fv-body video{max-width:100%; max-height:100%;}
  .fv-body pre{align-self:stretch; width:100%; margin:0; padding:18px 20px; white-space:pre-wrap; word-break:break-word; font-size:.82rem; background:#fff; color:var(--ink); text-align:left;}
  .fv-doc{align-self:stretch; width:100%; padding:24px 32px; background:#fff; text-align:left; line-height:1.6; font-size:.92rem; overflow:auto;}
  .fv-doc table{border-collapse:collapse; font-size:.8rem;}
  .fv-doc td,.fv-doc th{border:1px solid var(--line); padding:4px 8px;}
  .fv-doc img{max-width:100%;}
  .fv-sheet-name{font-weight:600; margin:14px 0 6px; font-size:.82rem; color:var(--muted);}
  .fv-msg{text-align:center; padding:32px; max-width:380px; color:var(--muted); font-size:.9rem; line-height:1.55;}
  .fv-msg .fv-ico{font-size:3rem; display:block; margin-bottom:10px;}
  .fv-msg b{color:var(--ink);}
  @media (max-width:600px){ .fv-backdrop{padding:0;} .fv-modal{height:100vh; width:100%; border-radius:0;} .fv-meta{display:none;} }

  /* ---------- Reminder toast ---------- */
  #toast-host{position:fixed; right:18px; bottom:18px; display:flex; flex-direction:column; gap:10px; z-index:1100; max-width:min(360px,calc(100vw - 36px));}
  .toast{background:var(--ink); color:#EAF6F7; border-left:4px solid var(--gold); border-radius:var(--radius); padding:12px 14px; font-size:.86rem; line-height:1.45; box-shadow:0 10px 30px rgba(0,0,0,.3);}
  .toast b{display:block; font-family:var(--font-serif); margin-bottom:2px;}
  .toast button{margin-top:8px; background:transparent; border:1px solid #4B7C86; color:#EAF6F7; border-radius:var(--radius); padding:3px 10px; cursor:pointer; font-size:.75rem;}
  .file-chip.file-rm{padding:5px 9px; color:var(--danger); border-color:var(--danger); background:var(--danger-tint); line-height:1;}
  .file-chip.file-rm:hover{background:var(--danger); color:#fff;}
  .btn-danger{background:transparent; border-color:var(--danger); color:var(--danger);}

<script>
/* ============================= DATA LAYER ============================= */
const DB = { classes:[], teachers:[], subjects:[], students:[], attendance:[], timetable:[], holidays:[], sessions:[], settings:[] };
const SYNC_TABLES = ['classes','teachers','subjects','students','attendance','timetable','holidays','sessions','settings'];

/* ---------- SECURITY ---------- */
const ADMIN_EMAIL_DEFAULT = '';   // <-- put the single admin e-mail here (login codes go to it). It can later be changed from Admin > Admin Account.
const ADMIN_CRED = { u:'Admin', h:'e15734e68ef984d24e5ee2985dae9ac401b054429cf3345e6a5a53642fa330a3' };   // PBKDF2 hash only — no plain password in code
(function(){
  const noop=function(){}; ['log','info','debug','warn'].forEach(k=>{ console[k]=noop; });
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('keydown',e=>{
    const k=(e.key||'').toLowerCase();
    if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&['i','j','c'].includes(k))||(e.ctrlKey&&['u','s'].includes(k))||(e.metaKey&&e.altKey&&['i','j','u'].includes(k))) e.preventDefault();
  });
  setInterval(()=>{ if(innerWidth>900&&(outerWidth-innerWidth>250||outerHeight-innerHeight>250)){
    document.body.innerHTML='<h2 style="font-family:sans-serif;padding:40px">Developer tools are not allowed. Close them and refresh.</h2>'; } },1000);
})();
async function hashPw(pw,salt){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode('atl$'+salt),iterations:100000},k,256);
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
function lockLeft(){ try{ const l=JSON.parse(localStorage.getItem('atl_lk')||'{}'); return Math.max(0,(l.until||0)-Date.now()); }catch(e){ return 0; } }
function failLogin(){ let l={}; try{ l=JSON.parse(localStorage.getItem('atl_lk')||'{}'); }catch(e){} l.n=(l.n||0)+1; if(l.n>=5) l.until=Date.now()+300000*Math.min(l.n-4,6); localStorage.setItem('atl_lk',JSON.stringify(l)); }
function okLogin(){ localStorage.removeItem('atl_lk'); }
let LAST_ACT=Date.now();
['click','keydown','mousemove','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{ LAST_ACT=Date.now(); },{passive:true}));
setInterval(()=>{ if(state.role && Date.now()-LAST_ACT>20*60000){ logout(); alert('Signed out after 20 minutes of inactivity.'); } },30000);
async function migrateTeacherPasswords(){
  const ch=[]; for(const t of DB.teachers){ if(t.password){ t.passHash=await hashPw(t.password,t.id); t.password=''; ch.push(t); } }
  if(ch.length) syncBulkUpsert('teachers',ch);
}


/* ============================= FIREBASE (FIRESTORE) BACKEND ============================= */
/* Data lives in Firebase Firestore (one collection per table, one document per record).
   Configure it from Admin > Settings (stored in this browser), OR paste your Project ID and
   Web API key into DEFAULT_BACKEND below so every teacher's device connects automatically.
   In this app's settings: "url" = Firebase Project ID, "key" = Firebase Web API key. */
const DEFAULT_BACKEND = { url:'cls-atds', key:'AIzaSyBHLtqo-OtavzjQty9YBLyy7n80AOqEjyo' };
const LS_SUPABASE_KEY = 'attlaw_supabase_cfg_v1';

function getSupabaseCfg(){
  try{
    const raw = localStorage.getItem(LS_SUPABASE_KEY);
    const cfg = raw ? JSON.parse(raw) : {};
    return {url:(cfg.url||DEFAULT_BACKEND.url||'').trim(), key:(cfg.key||DEFAULT_BACKEND.key||'').trim()};
  }catch(e){ return {url:(DEFAULT_BACKEND.url||'').trim(), key:(DEFAULT_BACKEND.key||'').trim()}; }
}
function setSupabaseCfg(url, key){ localStorage.setItem(LS_SUPABASE_KEY, JSON.stringify({url, key})); }
function clearSupabaseCfg(){ localStorage.removeItem(LS_SUPABASE_KEY); }
function BACKEND_ON(){ const c = getSupabaseCfg(); return !!(c.url && c.key); }

function fsRoot(c){ return 'projects/'+c.url+'/databases/(default)/documents'; }
async function fsPost(c, suffix, body){
  const r = await fetch('https://firestore.googleapis.com/v1/'+fsRoot(c)+suffix+'?key='+encodeURIComponent(c.key), {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
  });
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
function fsEnc(v){
  if(v === null || v === undefined) return {nullValue:null};
  if(typeof v === 'number') return Number.isInteger(v) ? {integerValue:String(v)} : {doubleValue:v};
  if(typeof v === 'boolean') return {booleanValue:v};
  if(typeof v === 'object') return {stringValue:JSON.stringify(v)};
  return {stringValue:String(v)};
}
function fsDec(key, v){
  if('stringValue' in v){
    if(key === 'files'){ try{ return JSON.parse(v.stringValue); }catch(e){ return []; } }
    return v.stringValue;
  }
  if('integerValue' in v) return Number(v.integerValue);
  if('doubleValue' in v) return v.doubleValue;
  if('booleanValue' in v) return v.booleanValue;
  return null;
}
// Attached class-note files are too big for a Firestore document (1 MB limit), so only name/size are shared.
function prepRow(table, row){
  if(table === 'sessions' && row && Array.isArray(row.files)){
    return Object.assign({}, row, {files: row.files.map(f=>({name:f.name, size:f.size, fid:f.fid||'', chunks:f.chunks||0}))});
  }
  return row;
}
function fsWrite(c, table, row){
  const fields = {};
  const r = prepRow(table, row);
  Object.keys(r).forEach(k=>{ if(r[k] !== undefined) fields[k] = fsEnc(r[k]); });
  return {update:{name: fsRoot(c)+'/'+table+'/'+r.id, fields}};
}
async function apiGetAll(){
  if(!BACKEND_ON()) return {ok:false};
  const c = getSupabaseCfg();
  try{
    const results = await Promise.all(SYNC_TABLES.map(t=>
      fsPost(c, ':runQuery', {structuredQuery:{from:[{collectionId:t}]}}).then(items=>
        items.filter(i=>i.document).map(i=>{
          const o = {};
          const f = i.document.fields || {};
          Object.keys(f).forEach(k=>{ o[k] = fsDec(k, f[k]); });
          if(o.id === undefined) o.id = i.document.name.split('/').pop();
          return o;
        })
      )
    ));
    const data = {};
    SYNC_TABLES.forEach((t,i)=> data[t] = results[i]);
    return {ok:true, data};
  }catch(err){ console.error('[sync] load failed', err); return {ok:false, error:err.message}; }
}
const LAST_REV={}; let REV_SEEN=null, POLL_BUSY=false, PENDING=false;
function revWrite(c, tables){
  tables=[].concat(tables); const ts=Date.now(), fields={};
  tables.forEach(t=>{ LAST_REV[t]=ts; fields[t]={integerValue:String(ts)}; });
  return {update:{name:fsRoot(c)+'/meta/rev', fields}, updateMask:{fieldPaths:tables}};
}
function chunkWrites(w){ const o=[]; for(let i=0;i<w.length;i+=450) o.push(w.slice(i,i+450)); return o; }
function syncFail(err){
  console.error('[sync] failed',err);
  syncNotice('Could not save to the database ('+err.message+'). '+(/40[13]/.test(err.message)?'Firestore rules are blocking the write - publish the updated rules from Admin > Settings.':'Check the internet connection and try again.'), true);
}
/* Pushes ONLY the given writes. The "something changed" marker travels in the same request,
   so a normal edit costs one round-trip instead of two. */
async function pushWrites(writes, tables){
  const c=getSupabaseCfg();
  if(!writes.length) return true;
  const chunks=chunkWrites(writes);
  try{
    if(chunks.length===1){
      try{ await fsPost(c,':commit',{writes:chunks[0].concat([revWrite(c,tables)])}); }
      catch(err){
        if(!/40[13]/.test(err.message)) throw err;
        await fsPost(c,':commit',{writes:chunks[0]});     // rules may lack "meta": still save the data
        syncNotice('Saved, but other devices will not update live. Add "meta" to the Firestore rules (Admin > Settings).', true);
      }
    } else {
      await Promise.all(chunks.map(ch=>fsPost(c,':commit',{writes:ch})));
      await fsPost(c,':commit',{writes:[revWrite(c,tables)]});
    }
  }catch(err){ syncFail(err); return false; }
  return true;
}
async function syncBatch(table, ups, dels){
  if(!BACKEND_ON()) return true;
  const c=getSupabaseCfg();
  const w=(ups||[]).map(r=>fsWrite(c,table,r)).concat((dels||[]).map(id=>({delete:fsRoot(c)+'/'+table+'/'+id})));
  return pushWrites(w,[table]);
}
/* Several tables in ONE request, e.g. timetable + period settings together. */
async function syncMulti(parts){
  if(!BACKEND_ON()) return true;
  const c=getSupabaseCfg(), w=[], tables=[];
  parts.forEach(p=>{
    const x=(p.ups||[]).map(r=>fsWrite(c,p.table,r)).concat((p.dels||[]).map(id=>({delete:fsRoot(c)+'/'+p.table+'/'+id})));
    if(x.length){ x.forEach(i=>w.push(i)); tables.push(p.table); }
  });
  return pushWrites(w,tables);
}
/* Pushes every local table in one go (used only by import / restore / "push local data"). */
async function syncSeedAll(){
  if(!BACKEND_ON()) return true;
  const c=getSupabaseCfg(), w=[];
  SYNC_TABLES.forEach(t=>DB[t].forEach(r=>w.push(fsWrite(c,t,r))));
  return pushWrites(w,SYNC_TABLES);
}
let _noticeT;
function syncNotice(msg, bad){
  let el=document.getElementById('sync-notice');
  if(!el){ el=document.createElement('div'); el.id='sync-notice'; el.setAttribute('role','status');

const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function rebuildMonths(){
  const map = {};
  const add = (prefix)=>{ if(!map[prefix]) map[prefix] = {name:MONTH_NAMES[Number(prefix.slice(5,7))-1], prefix, dates:[]}; return map[prefix]; };
  add(todayStr().slice(0,7));
  const seen = new Set();

/* Class-note files are stored in their own 'sessionfiles' collection, split into ~700 KB text chunks
   (a Firestore document is limited to 1 MB). The session row only keeps name/size/fid/chunks, so loading
   the class list stays fast; students download the chunks on demand. */
const FILE_CHUNK = 700000;
async function uploadSessionFile(f){
  if(f.fid || !f.dataUrl) return true;                       // already uploaded, or nothing to upload
  const c = getSupabaseCfg(), fid = uid('F'), parts = [];
  for(let i=0;i<f.dataUrl.length;i+=FILE_CHUNK) parts.push(f.dataUrl.slice(i, i+FILE_CHUNK));
  try{
    for(let i=0;i<parts.length;i++){
      await fsPost(c, ':commit', {writes:[{update:{name:fsRoot(c)+'/sessionfiles/'+fid+'_'+i,
        fields:{id:{stringValue:fid+'_'+i}, idx:{integerValue:String(i)}, data:{stringValue:parts[i]}}}}]});
    }
  }catch(err){ syncFail(err); return false; }
  f.fid = fid; f.chunks = parts.length;
  return true;
}
async function saveSession(subjectId, classId, teacherId, date, period, topics, files){
  const id = sessionKey(subjectId, date, period);
  if(BACKEND_ON()){
    for(const f of files){ if(!(await uploadSessionFile(f))) return false; }
  }
  let rec = DB.sessions.find(s=>s.id===id);
  if(rec){ rec.topics=topics; rec.files=files; rec.teacherId=teacherId; rec.classId=classId; }
  else{ rec = {id, subjectId, classId, teacherId, date, period, topics, files}; DB.sessions.push(rec); }
  if(BACKEND_ON()) return (await syncUpsert('sessions', rec)) !== false;
  return 'local';
}
/* ---- Removing shared content (whole entry, or a single file) ---- */
async function deleteSessionFileChunks(files){
  if(!BACKEND_ON()) return;
  const c = getSupabaseCfg(), w = [];
  (files||[]).forEach(f=>{ if(f && f.fid) for(let i=0;i<(f.chunks||0);i++) w.push({delete:fsRoot(c)+'/sessionfiles/'+f.fid+'_'+i}); });
  try{ for(const part of chunkWrites(w)) await fsPost(c, ':commit', {writes:part}); }catch(err){ console.error('[sync] chunk cleanup failed', err); }
}
async function removeSessionEntry(id){
  const rec = DB.sessions.find(s=>s.id===id); if(!rec) return true;
  if(BACKEND_ON() && (await syncDelete('sessions', id)) === false) return false;
  DB.sessions = DB.sessions.filter(s=>s.id!==id);
  deleteSessionFileChunks(rec.files);
  return true;
}
async function removeSessionFile(id, idx){
  const rec = DB.sessions.find(s=>s.id===id); if(!rec || !rec.files || !rec.files[idx]) return true;
  const gone = rec.files[idx], left = rec.files.filter((_,i)=>i!==idx);
  if(!rec.topics && !left.length) return removeSessionEntry(id);       // nothing would remain - drop the entry
  const prev = rec.files; rec.files = left;
  if(BACKEND_ON() && (await syncUpsert('sessions', rec)) === false){ rec.files = prev; return false; }
  deleteSessionFileChunks([gone]);
  return true;
}

/* ---- File viewer popup: opens teacher-shared files on the same page, with a Download button ---- */
const FILE_REG = [];                                   // chips refer to files by index into this list
function dataUrlToBlob(full, nameHint){
  const comma = full.indexOf(',');
  let mime = (full.slice(5, comma).split(';')[0]) || '';
  const bin = atob(full.slice(comma+1)), bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  if(!mime || mime==='application/octet-stream') mime = guessMime(nameHint) || mime || 'application/octet-stream';
  return new Blob([bytes], {type:mime});
}
function fileExt(name){ const m = /\.([a-z0-9]+)$/i.exec(name||''); return m ? m[1].toLowerCase() : ''; }
function guessMime(name){
  return ({pdf:'application/pdf', png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif', webp:'image/webp', svg:'image/svg+xml',
    mp4:'video/mp4', webm:'video/webm', mp3:'audio/mpeg', wav:'audio/wav', txt:'text/plain', csv:'text/csv'})[fileExt(name)] || '';
}
async function fetchSessionFileBlob(f){
  if(f.dataUrl) return dataUrlToBlob(f.dataUrl, f.name);
  const c = getSupabaseCfg(), pieces = [];
  for(let i=0;i<f.chunks;i++){
    const r = await fetch('https://firestore.googleapis.com/v1/'+fsRoot(c)+'/sessionfiles/'+f.fid+'_'+i+'?key='+encodeURIComponent(c.key));
    if(!r.ok) throw new Error('HTTP '+r.status);
    pieces.push(((await r.json()).fields||{}).data.stringValue);
  }
  return dataUrlToBlob(pieces.join(''), f.name);
}
function fileKind(name, mime){
  const e = fileExt(name);
  if(/^image\//.test(mime) || ['png','jpg','jpeg','gif','webp','bmp','svg'].includes(e)) return 'image';
  if(mime==='application/pdf' || e==='pdf') return 'pdf';
  if(/^video\//.test(mime) || ['mp4','webm','ogv'].includes(e)) return 'video';
  if(/^audio\//.test(mime) || ['mp3','wav','ogg','m4a'].includes(e)) return 'audio';
  if(['xlsx','xls','csv'].includes(e)) return 'sheet';
  if(e==='docx') return 'docx';
  if(['txt','md','json','log','xml','html','js','css','py','java','c','cpp'].includes(e) || /^text\//.test(mime)) return 'text';
  return 'other';
}
function cleanHtml(dirty){                              // strip anything executable from converted document HTML
  const doc = new DOMParser().parseFromString(dirty, 'text/html');
  doc.querySelectorAll('script,iframe,object,embed,style,link,meta,form').forEach(n=>n.remove());
  doc.querySelectorAll('*').forEach(n=>Array.from(n.attributes).forEach(a=>{
    if(/^on/i.test(a.name) || (/^(href|src)$/i.test(a.name) && /^\s*javascript:/i.test(a.value))) n.removeAttribute(a.name);
  }));
  return doc.body.innerHTML;
}

  title.textContent = FV.name; meta.textContent = fvSize(f.size); dl.disabled = true;
  body.innerHTML = fvMsg('⏳', 'Loading…');
  bd.classList.add('open'); bd.setAttribute('aria-hidden','false'); document.body.style.overflow = 'hidden';
  $('#fv-close').focus();
  try{
    const blob = await fetchSessionFileBlob(f);
    if(token !== FV.token) return;                      // closed or another file opened meanwhile
    FV.blob = blob; FV.url = URL.createObjectURL(blob); dl.disabled = false;
    const kind = fileKind(FV.name, blob.type);
    if(kind==='image'){ body.innerHTML = ''; const im = new Image(); im.alt = FV.name; im.src = FV.url; body.appendChild(im); }
    else if(kind==='pdf'){ body.innerHTML = '<iframe title="'+escapeHtml(FV.name)+'" src="'+FV.url+'"></iframe>'; }
    else if(kind==='video'){ body.innerHTML = '<video controls src="'+FV.url+'"></video>'; }
    else if(kind==='audio'){ body.innerHTML = '<audio controls src="'+FV.url+'"></audio>'; }
    else if(kind==='text'){
      let t = await blob.text(); if(token !== FV.token) return;
      if(t.length > 200000) t = t.slice(0,200000) + '\n\n… (preview truncated — download for the full file)';
      body.innerHTML = '<pre>'+escapeHtml(t)+'</pre>';
    }
    else if(kind==='sheet' && window.XLSX){
      const wb = XLSX.read(await blob.arrayBuffer(), {type:'array'}); if(token !== FV.token) return;
      body.innerHTML = '<div class="fv-doc">'+wb.SheetNames.slice(0,10).map(n=>{
        const ws = wb.Sheets[n], rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:false}).slice(0,500);
        return '<div class="fv-sheet-name">'+escapeHtml(n)+'</div><div style="overflow:auto"><table>'
          + rows.map(r=>'<tr>'+r.map(c=>'<td>'+escapeHtml(c)+'</td>').join('')+'</tr>').join('') + '</table></div>';
      }).join('')+'</div>';
    }
    else if(kind==='docx' && window.mammoth){
      const res = await mammoth.convertToHtml({arrayBuffer: await blob.arrayBuffer()}); if(token !== FV.token) return;
      body.innerHTML = '<div class="fv-doc">'+cleanHtml(res.value)+'</div>';
    }
    else{
      const e = fileExt(FV.name).toUpperCase();
      body.innerHTML = fvMsg(['PPT','PPTX'].includes(e)?'📊':'📄',
        '<b>'+escapeHtml(e ? e+' files' : 'This file type')+' can\u2019t be previewed in the browser.</b><br>Use the Download button above to open it in the right app.');
    }
  }catch(err){
    if(token !== FV.token) return;
    body.innerHTML = fvMsg('⚠️', '<b>Couldn\u2019t open the file.</b><br>'+escapeHtml(err.message)+'<br>If this says 403, publish the updated Firestore rules from Admin &gt; Settings.');
  }
}

const MAX_FILE_BYTES = 2 * 1024 * 1024; // 2MB per file (stored as chunks in Firestore)
function readFilesAsDataUrls(fileList){
  const files = Array.from(fileList || []);
  const oversized = files.filter(f=>f.size > MAX_FILE_BYTES);
  const accepted = files.filter(f=>f.size <= MAX_FILE_BYTES);
  const readers = accepted.map(f=> new Promise(res=>{
    const r = new FileReader();
    r.onload = ()=> res({name:f.name, size:f.size, dataUrl:r.result});
    r.onerror = ()=> res(null);
    r.readAsDataURL(f);
  }));
  return Promise.all(readers).then(results=>({
    files: results.filter(Boolean),
    oversized: oversized.map(f=>f.name)
  }));
}

const EMAIL_RE = /^[a-z0-9._%+\-]{1,64}@[a-z0-9\-]+(\.[a-z0-9\-]+)*\.[a-z]{2,}$/i;
function normEmail(v){ return String(v||'').trim().toLowerCase(); }
function validEmail(v){ return v.length<=254 && EMAIL_RE.test(v) && !/\.\./.test(v); }
function normPhone(v){                                   // -> +<country><number>; bare 10-digit numbers are treated as Indian (+91)
  const p = String(v||'').replace(/[\s\-().]/g,'');
  if(/^\d{10}$/.test(p)) return '+91'+p;
  if(/^0\d{10}$/.test(p)) return '+91'+p.slice(1);
  if(/^91\d{10}$/.test(p)) return '+'+p;
  return p;
}
function validPhone(p){ return /^\+[1-9]\d{9,14}$/.test(p); }
function contactCellHtml(t){
  const e = t.email ? '<a href="mailto:'+escapeHtml(t.email)+'">'+escapeHtml(t.email)+'</a>' : '<span class="badge badge-warning">No email</span>';
  const ph = t.phone ? '<a href="tel:'+escapeHtml(t.phone)+'">'+escapeHtml(t.phone)+'</a>' : '<span class="muted">No phone</span>';
  return '<div class="contact-line">'+e+'<br>'+ph+'</div>';
}
/* validates and normalises contact fields; returns {error} or {email, phone} */
function readContact(emailEl, phoneEl, selfId, requireEmail){
  const email = normEmail(emailEl.value), phone = normPhone(phoneEl.value);
  if(requireEmail && !email) return {error:'Email is required — attendance confirmations are sent there.'};
  if(email && !validEmail(email)) return {error:'Enter a valid email address.'};
  if(phoneEl.value.trim() && !validPhone(phone)) return {error:'Enter a valid phone number (10 digits, or with country code like +91…).'};
  if(email && DB.teachers.some(t=>t.id!==selfId && normEmail(t.email)===email)) return {error:'Another teacher already uses this email.'};
  return {email, phone: phoneEl.value.trim() ? phone : ''};
}

async function login(role){
  showLoginError(role, '');
  if(lockLeft()){ showLoginError(role,'Too many attempts. Try again in '+Math.ceil(lockLeft()/60000)+' min.'); return; }

  if(role==='student'){
    const reg = $('#student-reg').value.trim();
    const dob = $('#student-pass').value.trim();
    if(!reg || !dob){ showLoginError('student', 'Enter your register number and phone number.'); return; }
    const student = DB.students.find(s=>s.regNo.toLowerCase()===reg.toLowerCase());
    const dg = v=>String(v||'').replace(/\D/g,'');
    if(!student || !dg(student.phone) || dg(student.phone) !== dg(dob)){ failLogin(); showLoginError('student', 'Register number or phone number is incorrect.'); return; }
    state.role = 'student';
    state.studentId = student.id;
    $('#student-reg').value=''; $('#student-pass').value='';
  }
  else if(role==='teacher'){
    const tid = $('#teacher-id-input').value.trim();
    const pass = $('#teacher-pass').value;
    if(!tid || !pass){ showLoginError('teacher', 'Enter your teacher ID and password.'); return; }
    const teacher = DB.teachers.find(t=>t.teacherId.toLowerCase()===tid.toLowerCase());
    let ok=false;
    if(teacher){
      if(teacher.passHash) ok=(await hashPw(pass,teacher.id))===teacher.passHash;
      else if(teacher.password && teacher.password===pass){ ok=true; teacher.passHash=await hashPw(pass,teacher.id); teacher.password=''; syncUpsert('teachers',teacher); }
    }
    if(!ok){ failLogin(); showLoginError('teacher', 'Teacher ID or password is incorrect.'); return; }
    state.role = 'teacher';
    state.teacherId = teacher.id;
    state.teacherTab = 'dashboard';
    $('#teacher-id-input').value=''; $('#teacher-pass').value='';
  }
  else if(role==='admin'){
    const user = $('#admin-user').value.trim();
    const pass = $('#admin-pass').value;
    const A = adminAccount();
    const h=await hashPw(pass,'admin');
    if(user !== A.user || h !== A.h){ failLogin(); showLoginError('admin', 'Username or password is incorrect.'); return; }
    if(A.email && BACKEND_ON()){
      const b=$('#admin-signin-btn'); b.disabled=true; b.textContent='Sending code…';
      try{ await otpIssue('login', A.email, 'login'); }
      catch(e){ showLoginError('admin','Could not send the verification code ('+e.message+'). Check the database rules and e-mail delivery setup.'); return; }
      finally{ b.disabled=false; b.textContent='Sign in as admin'; }
      showAdminOtp(A.email);
      return;
    }
    // No admin e-mail configured yet (first run) or no database: password-only, and the admin is sent to set the e-mail.
    await finishAdminLogin(!A.email);
    return;
  }

  await fpOffer();
  enterApp();
}

/* ---------- Admin account + e-mail one-time codes (OTP) ---------- */
function adminAccount(){
  const s = getSetting('adminAcct', {}) || {};
  return {user:s.user||ADMIN_CRED.u, h:s.h||ADMIN_CRED.h, email:normEmail(s.email||ADMIN_EMAIL_DEFAULT)};
}
function maskEmail(e){ const [u,d]=String(e).split('@'); return (u||'').slice(0,1)+'***@'+(d||''); }
const OTPS = {};     // key -> {id,h,exp,tries,sentAt}; only a hash of the code is kept in memory
async function otpDrop(key){
  const r=OTPS[key]; if(!r) return; delete OTPS[key];
  try{ const c=getSupabaseCfg(); await fsPost(c,':commit',{writes:[{delete:fsRoot(c)+'/mail/'+r.id}]}); }catch(e){}
}
async function otpIssue(key, to, purpose){
  const prev=OTPS[key]; if(prev && Date.now()-prev.sentAt<30000) throw new Error('wait 30 seconds before asking for another code');
  await otpDrop(key);
  const code=String(100000 + (crypto.getRandomValues(new Uint32Array(1))[0] % 900000));
  const id=uid('otp_');
  const what = purpose==='login' ? 'sign in to the admin portal' : 'confirm a change to the admin details';
  const m={subject:'Your verification code',
    text:'Your verification code to '+what+' is '+code+'.\n\nIt is valid for 5 minutes. If this was not you, ignore this e-mail and change the admin password.\n\n'+collegeName(),
    html:mailWrap('Verification code','<p>Use this code to '+escapeHtml(what)+':</p><p style="font-size:28px;letter-spacing:6px;font-weight:700;margin:12px 0;">'+code+'</p><p>It is valid for 5 minutes. If this was not you, ignore this e-mail and change the admin password.</p>')};
  await queueMail(id,{to:normEmail(to),subject:m.subject,text:m.text,html:m.html,kind:'otp',by:'system'},false);
  OTPS[key]={id, h:await hashPw(code,'otp'+id), exp:Date.now()+300000, tries:0, sentAt:Date.now()};
}
async function otpCheck(key, code){
  const r=OTPS[key]; if(!r) return {s:'expired'};
  if(Date.now()>r.exp){ otpDrop(key); return {s:'expired'}; }
  r.tries++;
  if((await hashPw(String(code||'').trim(),'otp'+r.id))===r.h){ await otpDrop(key); return {s:'ok'}; }
  if(r.tries>=5){ otpDrop(key); return {s:'locked'}; }
  return {s:'bad', left:5-r.tries};
}

async function verifyAdminOtp(){
  showLoginError('admin','');
  if(lockLeft()){ showLoginError('admin','Too many attempts. Try again in '+Math.ceil(lockLeft()/60000)+' min.'); return; }
  const r=await otpCheck('login', $('#admin-otp').value);
  if(r.s==='ok'){ await finishAdminLogin(false); return; }
  failLogin();
  if(r.s==='expired'){ resetAdminLoginUi(true); showLoginError('admin','That code has expired. Sign in again to get a new one.'); }
  else if(r.s==='locked'){ resetAdminLoginUi(true); showLoginError('admin','Too many wrong codes. Sign in again to get a new one.'); }
  else { showLoginError('admin','Incorrect code. '+r.left+' attempt'+(r.left===1?'':'s')+' left.'); $('#admin-otp').value=''; }
}

}

/* ---------- Fingerprint (device biometric) sign-in ---------- */
// Uses the phone's own fingerprint sensor (WebAuthn). The fingerprint never leaves the device.
// true = fingerprint works only in the installed app; false = also in a normal browser tab.
const FP_APP_ONLY = true;
const FP_KEY='atl_fp', FP_NO='atl_fp_no';
function fpList(){ try{ return JSON.parse(localStorage.getItem(FP_KEY)||'[]'); }catch(e){ return []; } }
function fpSave(l){ try{ localStorage.setItem(FP_KEY, JSON.stringify(l)); }catch(e){} }
function fpIsApp(){ return !FP_APP_ONLY || (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone===true; }
async function fpAvailable(){
  try{ return !!(window.PublicKeyCredential && window.isSecureContext && fpIsApp() && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }
  catch(e){ return false; }
}
function fpB64(buf){ let b=''; new Uint8Array(buf).forEach(x=>{ b+=String.fromCharCode(x); }); return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function fpUn(str){ str=str.replace(/-/g,'+').replace(/_/g,'/'); while(str.length%4) str+='='; return Uint8Array.from(atob(str),c=>c.charCodeAt(0)); }
function fpRole(){ const t=document.querySelector('.role-tab.active'); return (t&&t.dataset.role)||'student'; }
function fpWho(){
  if(state.role==='student'){ const x=DB.students.find(v=>v.id===state.studentId); return x&&{role:'student',key:x.id,name:x.name}; }
  if(state.role==='teacher'){ const x=DB.teachers.find(v=>v.id===state.teacherId); return x&&{role:'teacher',key:x.id,name:x.name}; }
  if(state.role==='admin') return {role:'admin',key:'admin',name:'Administrator'};
  return null;
}
// After a normal password sign-in, offers to enrol this device's fingerprint (once per person per device).
async function fpOffer(){
  try{
    if(!(await fpAvailable())) return;
    const w=fpWho(); if(!w || w.role==='admin') return;
    const id=w.role+':'+w.key;
    if(fpList().some(e=>e.id===id)) return;
    let no=[]; try{ no=JSON.parse(localStorage.getItem(FP_NO)||'[]'); }catch(e){}
    if(no.includes(id)) return;
    if(!confirm('Use your fingerprint to sign in next time on this device?')){ no.push(id); try{ localStorage.setItem(FP_NO, JSON.stringify(no)); }catch(e){} return; }
    const cred = await navigator.credentials.create({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      rp:{name:'Attendance Ledger'},
      user:{id:new TextEncoder().encode(id), name:w.name, displayName:w.name},
      pubKeyCredParams:[{type:'public-key',alg:-7}],
      authenticatorSelection:{authenticatorAttachment:'platform', userVerification:'required', residentKey:'discouraged'},
      attestation:'none', timeout:60000
    }});
    const l=fpList().filter(e=>e.id!==id);
    l.push({id, role:w.role, key:w.key, name:w.name, cid:fpB64(cred.rawId), pk:(cred.response.getPublicKey?fpB64(cred.response.getPublicKey()):'')});
    fpSave(l);
    showToast('Fingerprint enabled','You can now sign in with your fingerprint on this device.');
  }catch(e){ /* cancelled or not supported: continue with normal sign-in */ }
}
function fpDerToRaw(der){
  der=new Uint8Array(der); let i=2;
  const rl=der[i+1], r=der.slice(i+2,i+2+rl); i=i+2+rl;
  const sl=der[i+1], sg=der.slice(i+2,i+2+sl);
  const fix=x=>{ while(x.length>32&&x[0]===0) x=x.slice(1); const o=new Uint8Array(32); o.set(x,32-x.length); return o; };
  const out=new Uint8Array(64); out.set(fix(r),0); out.set(fix(sg),32); return out;
}
async function fpSignIn(){
  const role=fpRole();
  showLoginError(role,'');
  if(role==='admin'){ showLoginError(role,'Admin sign-in needs your password and an e-mail code.'); return; }
  if(lockLeft()){ showLoginError(role,'Too many attempts. Try again in '+Math.ceil(lockLeft()/60000)+' min.'); return; }
  const list=fpList().filter(e=>e.role===role); if(!list.length) return;
  try{
    const challenge=crypto.getRandomValues(new Uint8Array(32));
    const a=await navigator.credentials.get({publicKey:{challenge, allowCredentials:list.map(e=>({type:'public-key',id:fpUn(e.cid)})), userVerification:'required', timeout:60000}});
    const e=list.find(x=>x.cid===fpB64(a.rawId)); if(!e) throw new Error('unknown');
    const r=a.response, ad=new Uint8Array(r.authenticatorData);
    if(!(ad[32]&0x04)) throw new Error('not verified');
    const cd=JSON.parse(new TextDecoder().decode(r.clientDataJSON));
    if(cd.type!=='webauthn.get' || cd.challenge!==fpB64(challenge) || cd.origin!==location.origin) throw new Error('bad data');
    if(e.pk){
      const key=await crypto.subtle.importKey('spki',fpUn(e.pk),{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
      const h=new Uint8Array(await crypto.subtle.digest('SHA-256',r.clientDataJSON));
      const data=new Uint8Array(ad.length+32); data.set(ad,0); data.set(h,ad.length);
      if(!(await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,fpDerToRaw(r.signature),data))) throw new Error('bad signature');
    }
    if(role==='student'){ const s=DB.students.find(x=>x.id===e.key); if(!s) throw new Error('gone'); state.role='student'; state.studentId=s.id; }
    else if(role==='teacher'){ const t=DB.teachers.find(x=>x.id===e.key); if(!t) throw new Error('gone'); state.role='teacher'; state.teacherId=t.id; state.teacherTab='dashboard'; }
    else { state.role='admin'; state.adminTab='overview'; migrateTeacherPasswords(); }
    okLogin(); enterApp();
  }catch(err){
    showLoginError(role, err&&err.name==='NotAllowedError' ? 'Fingerprint was cancelled. Try again or use your password.' : 'Fingerprint sign-in failed. Please use your password.');
  }
}
async function fpRefresh(){
  const box=$('#fp-box'); if(!box) return;
  const show = fpRole()!=='admin' && fpList().some(e=>e.role===fpRole()) && await fpAvailable();
  box.style.display = show ? 'block' : 'none';
}
document.addEventListener('click', ev=>{
  const t=ev.target.closest && ev.target.closest('.role-tab,#fp-btn,#fp-forget'); if(!t) return;
  if(t.classList.contains('role-tab')) setTimeout(fpRefresh,0);
  else if(t.id==='fp-btn') fpSignIn();
  else if(t.id==='fp-forget' && confirm('Remove fingerprint sign-in for this role on this device?')){ fpSave(fpList().filter(e=>e.role!==fpRole())); fpRefresh(); }
});
fpRefresh();

function renderStudentContentTab(){
  const student = DB.students.find(s=>s.id===state.studentId);
  const subjects = DB.subjects.filter(su=>su.classId===student.classId);
  const subjectIds = new Set(subjects.map(s=>s.id));
  const all = DB.sessions.filter(s=>subjectIds.has(s.subjectId) && (s.topics || (s.files&&s.files.length)))
    .slice().sort((a,b)=> a.date<b.date?1:(a.date>b.date?-1:b.period-a.period));
  const sel = state.contentSubject && subjectIds.has(state.contentSubject) ? state.contentSubject : 'all';
  const sessions = sel==='all' ? all : all.filter(s=>s.subjectId===sel);
  const cnt = id=>all.filter(s=>s.subjectId===id).length;

  let html = '<div class="page-head"><div><h1>My Content</h1><div class="sub">Topics covered and files shared by your faculty, newest first. Updates automatically.</div></div></div>';
  html += '<div class="day-chips"><button class="day-chip '+(sel==='all'?'on':'')+'" data-csub="all">All subjects ('+all.length+')</button>'
    + subjects.map(su=>'<button class="day-chip '+(sel===su.id?'on':'')+'" data-csub="'+su.id+'">'+escapeHtml(su.name)+' ('+cnt(su.id)+')</button>').join('')+'</div>';
  if(!sessions.length){
    html += '<div class="card"><p class="empty">Nothing has been shared yet'+(sel==='all'?'':' for this subject')+'. Notes and files your faculty add after class will appear here.</p></div>';
  } else {
    html += sessions.map(s=>{
      const su = DB.subjects.find(x=>x.id===s.subjectId);
      const t = su ? DB.teachers.find(x=>x.id===su.teacherId) : null;
      const isNew = s.date >= (()=>{ const d=new Date(); d.setDate(d.getDate()-2); return d.toLocaleDateString('en-CA'); })();
      return '<div class="session-card"><div class="sc-head"><span class="sc-title">'+escapeHtml(su?su.name:'—')+(isNew?' <span class="badge badge-success">New</span>':'')+'</span>'
        + '<span class="sc-date">'+s.date+' · Period '+s.period+(t?' · '+escapeHtml(t.name):'')+'</span></div>'
        + (s.topics ? '<div class="sc-topics">'+escapeHtml(s.topics)+'</div>' : '<p class="sub" style="margin:6px 0;">No written notes for this class.</p>')
        + fileChipListHtml(s.files)
        + '</div>';
    }).join('');
  }
  $('#student-content').innerHTML = html;
  $all('[data-csub]').forEach(b=>b.addEventListener('click', ()=>{ state.contentSubject = b.dataset.csub; renderStudentContentTab(); }));
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---- holidays & events shown on student + teacher dashboards ---- */
function upcomingHolidays(days){
  const t=todayStr(), e=new Date(); e.setDate(e.getDate()+days);
  const end=e.toLocaleDateString('en-CA');
  return DB.holidays.filter(h=>h.date>=t && h.date<=end).sort((a,b)=>a.date<b.date?-1:1);
}
function daysAway(d){
  const n=Math.round((new Date(d+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/86400000);
  return n===0?'Today':n===1?'Tomorrow':'in '+n+' days';
}
function holidayTodayHtml(){
  return DB.holidays.filter(h=>h.date===todayStr()).map(h=>'<div class="notice notice-warning"><b>Today · '+escapeHtml(h.name)+'</b> ('+escapeHtml(h.type)+')</div>').join('');
}
function holidayUpcomingHtml(){
  const list=upcomingHolidays(45);
  return '<div class="card"><h3>Upcoming holidays &amp; events</h3>'
    + (list.length ? list.slice(0,6).map(h=>'<div class="holiday-row"><span class="holiday-date">'+h.date+'</span><span class="holiday-name">'+escapeHtml(h.name)+'</span><span class="badge badge-'+(h.type==='Holiday'?'danger':'warning')+'">'+escapeHtml(h.type)+'</span><span class="sub">'+daysAway(h.date)+'</span></div>').join('')
      : '<p class="empty">No holidays or events in the next 45 days.</p>')
    + '</div>';
}

function renderHolidayListView(role){
  const list = DB.holidays.slice().sort((a,b)=> a.date<b.date?-1:1);
  let html = '<div class="page-head"><div><h1>Academic Calendar</h1><div class="sub">Institution holidays and events.</div></div></div>';
  html += '<div class="card">' + (list.length
    ? list.map(h=>'<div class="holiday-row"><span class="holiday-date">'+h.date+'</span><span class="holiday-name">'+h.name+'</span><span class="badge badge-'+(h.type==='Holiday'?'danger':'warning')+'">'+h.type+'</span></div>').join('')
    : '<p class="empty">No holidays have been added yet.</p>') + '</div>';
  $('#'+role+'-content').innerHTML = html;
}

/* Renders a Mon–Sat × period timetable grid for a class.
   onCellClick(day, period, entry) — if provided, cells become clickable (used by admin editor via renderAdminTimetable itself). */
function timetableGridHtml(classId, highlightTeacherId, opts){
  opts=opts||{}; const DAYS=(opts.day&&opts.day!=='all')?[opts.day]:WEEKDAYS;
  let rows = '<tr><th>Period</th>' + DAYS.map(d=>'<th>'+d+'</th>').join('') + '</tr>';
  PERIODS.forEach(period=>{
    if(opts.period && opts.period!=='all' && Number(opts.period)!==period) return;
    rows += '<tr><td class="tt-period-label">P'+period+'<div class="tt-period-time">'+PERIOD_TIMES[period]+'</div></td>';
    DAYS.forEach(day=>{
      const entry = timetableEntry(classId, day, period);
      const su = entry ? DB.subjects.find(x=>x.id===entry.subjectId) : null;
      const t = su ? DB.teachers.find(x=>x.id===su.teacherId) : null;
      if(opts.mine&&highlightTeacherId&&!(su&&su.teacherId===highlightTeacherId)){ rows+='<td><div class="tt-empty-cell">—</div></td>'; return; }
      if(su){
        const dim = highlightTeacherId && su.teacherId!==highlightTeacherId;
        rows += '<td><div class="tt-cell-view" style="'+(dim?'opacity:.35;':'')+'"><span class="tt-sub">'+escapeHtml(su.name)+'</span>'+(t?'<span class="tt-teach">'+escapeHtml(t.name)+'</span>':'')+'</div></td>';
      } else if(entry && entry.text){
        const dim = highlightTeacherId ? 'opacity:.35;' : '';
        rows += '<td><div class="tt-cell-view" style="'+dim+'"><span class="tt-sub">'+escapeHtml(entry.text)+'</span></div></td>';
      } else {
        rows += '<td><div class="tt-empty-cell">—</div></td>';
      }
    });
    rows += '</tr>';
  });
  return '<table class="tt-table">'+rows+'</table>';
}

    + '<div class="card"><h3>Month-by-month trend</h3><p class="chart-note">Is your attendance getting better or worse?</p>' + cv('ch-trend',190) + '</div>'
    + '</div>';

  html += '<div class="card"><h3>Which subjects need attention?</h3><p class="chart-note">Each bar is one subject. The dashed line is the 75% you need.</p>' + legendHtml() + cv('ch-stu', Math.max(150, overall.subjects.length*44+40)) + '</div>';

    options:{indexAxis:'y', maintainAspectRatio:false, plugins:{legend:{display:false}, targetLine:{value:75}, tooltip:{callbacks:{label:c=>c.parsed.x+'% attendance'}}}, scales:{x:{min:0,max:100,ticks:{callback:v=>v+'%'}, grid:{color:CLR.grid}}, y:{grid:{display:false}}}}, plugins:[targetLine]});

function studentDayStats(studentId, dateStr){
  const recs = DB.attendance.filter(a=>a.studentId===studentId && a.date===dateStr);
  if(!recs.length) return null;
  const present = recs.filter(r=>r.status==='P').length;
  return {held:recs.length, present, absent:recs.length-present, pct:Math.round((present/recs.length)*1000)/10, recs};
}

function renderStudentCalendar(){
  const student = DB.students.find(s=>s.id===state.studentId);
  if(!state.studentCalMonth) state.studentCalMonth = monthsData[monthsData.length-1].prefix;
  const m = state.studentCalMonth;

  let html = '<div class="page-head"><div><h1>Calendar</h1><div class="sub">Day-by-day attendance for '+student.name+'.</div></div></div>';
  html += '<div class="card"><div class="cal-toolbar"><div class="field" style="margin:0;min-width:180px;"><label>Month</label><select id="scal-month">'
    + monthsData.map(mo=>'<option value="'+mo.prefix+'" '+(mo.prefix===m?'selected':'')+'>'+mo.name+' '+mo.prefix.slice(0,4)+'</option>').join('')
    + '</select></div></div>'
    + calendarHtml(m, d=>studentDayStats(student.id, d), state.studentCalDate)

  html += '<div class="card" id="scal-detail">' + studentCalDetailHtml(student, state.studentCalDate) + '</div>';

  $('#scal-month').addEventListener('change', e=>{ state.studentCalMonth = e.target.value; state.studentCalDate=null; renderStudentCalendar(); });

function studentCalDetailHtml(student, dateStr){
  if(!dateStr) return '<h3>Select a day</h3><p class="sub">Click any coloured day above to see that day\'s subject-wise attendance.</p>';

  return '<h3>'+dateStr+' · '+day.present+' of '+day.held+' classes attended ('+day.pct+'%)</h3>'+holidayNoteHtml(dateStr)
    + '<div class="cal-detail-list">' + day.recs.map(r=>{

}

function renderTeacherMark(teacher){
  const subjects = DB.subjects.filter(su=>su.teacherId===teacher.id);
  if(!state.markSubject || !subjects.find(s=>s.id===state.markSubject)) state.markSubject = subjects[0] ? subjects[0].id : null;

  let html = '<div class="page-head"><div><h1>Mark attendance</h1><div class="sub">Select a subject, date and period, then record who attended.</div></div></div>';

  if(!subjects.length){
    html += '<div class="card"><p class="empty">No subjects are assigned to you yet.</p></div>';
    $('#teacher-content').innerHTML = html;
    return;
  }

  html += holidayNoteHtml(state.markDate);
  html += '<div class="card"><div class="form-row">'
    + '<div class="field"><label>Subject</label><select id="mark-subject">' + subjects.map(su=>'<option value="'+su.id+'" '+(su.id===state.markSubject?'selected':'')+'>'+escapeHtml(su.name)+'</option>').join('') + '</select></div>'
    + '<div class="field"><label>Date</label><input type="date" id="mark-date" value="'+state.markDate+'"/></div>'
    + '<div class="field"><label>Period</label><select id="mark-period">' + PERIODS.map(p=>'<option value="'+p+'" '+(p===state.markPeriod?'selected':'')+'>Period '+p+' · '+PERIOD_TIMES[p]+'</option>').join('') + '</select></div>'
    + '</div><button class="btn btn-ghost" id="load-students-btn">Load class list</button></div>';

  const subject = DB.subjects.find(s=>s.id===state.markSubject);
  const students = DB.students.filter(s=>s.classId===subject.classId);

  if(state.markLoaded){
    html += '<div class="card"><div class="mark-toolbar"><h3>'+subject.name+' · '+students.length+' students</h3><button class="btn btn-ghost btn-sm" id="mark-all-present">Mark all present</button></div>'
      + '<table class="table"><thead><tr><th>Reg. no.</th><th>Student</th><th>Status</th></tr></thead><tbody>'
      + students.map(s=>{
          const status = state.markDraft[s.id] || 'P';
          return '<tr><td>'+escapeHtml(s.regNo)+'</td><td>'+escapeHtml(s.name)+'</td><td><div class="toggle-group" data-student="'+s.id+'">'
            + '<button class="toggle-btn '+(status==='P'?'active-present':'')+'" data-status="P">Present</button>'
            + '<button class="toggle-btn '+(status==='A'?'active-absent':'')+'" data-status="A">Absent</button>'
            + '</div></td></tr>';
        }).join('')
      + '</tbody></table><button class="btn btn-primary" id="save-attendance-btn" style="margin-top:16px;">Save attendance</button><span id="save-confirm" class="save-confirm"></span></div>';
  }

  // Class notes: topics covered + files, saved against this exact subject/date/period, visible to students.
  {
    const existingSession = getSession(state.markSubject, state.markDate, state.markPeriod);
    const draftTopics = state.sessionDraft.topics!==null ? state.sessionDraft.topics : ((existingSession && existingSession.topics) || '');
    const savedFiles = (existingSession && existingSession.files) || [];
    html += '<div class="card"><h3>Class notes &amp; files for students</h3><p class="sub" style="margin-bottom:12px;">Notes for <b>'+escapeHtml(subject.name)+'</b> · '+state.markDate+' · Period '+state.markPeriod+'. Students of this class see them under <b>My Content</b> within a few seconds of saving. This is saved separately from attendance.'+(existingSession?' <span class="badge badge-success">Already shared</span>':'')+'</p>'
      + '<div class="field"><label>Topics covered</label><textarea id="session-topics" placeholder="Topics covered in this class">'+escapeHtml(draftTopics)+'</textarea></div>'
      + '<div class="field"><label>Attach files (slides, notes, worksheets) · max 2 MB each</label><input type="file" id="session-files" multiple/></div>'
      + (savedFiles.length?'<div class="sub">Already shared (✕ removes a file):</div>'+fileChipListHtml(savedFiles, {sid:existingSession.id}):'')
      + (state.sessionDraft.files.length?'<div class="sub" style="margin-top:8px;">Ready to upload (press Save):</div>'+fileChipListHtml(state.sessionDraft.files, {draft:true}):'')
      + '<div class="btn-row" style="margin-top:10px;"><button class="btn btn-primary btn-sm" id="save-session-btn">Save &amp; share with students</button>'
      + (existingSession?'<button class="btn btn-danger btn-sm" data-rmsession="'+existingSession.id+'">Delete notes &amp; files</button>':'')
      + '<span id="session-confirm" class="save-confirm"></span></div>'
      + '</div>';
  }

  $('#teacher-content').innerHTML = html;

  $('#mark-subject').addEventListener('change', e=>{ state.markSubject=e.target.value; state.markLoaded=false; state.markDraft={}; state.sessionDraft={topics:null,files:[]}; renderTeacherMark(teacher); });
  $('#mark-date').addEventListener('change', e=>{ state.markDate=e.target.value; state.sessionDraft={topics:null,files:[]}; renderTeacherMark(teacher); });
  $('#mark-period').addEventListener('change', e=>{ state.markPeriod=Number(e.target.value); state.sessionDraft={topics:null,files:[]}; renderTeacherMark(teacher); });
  $('#load-students-btn').addEventListener('click', ()=>{
    state.markLoaded = true;
    state.markDraft = {};
    students.forEach(s=>state.markDraft[s.id]='P');
    renderTeacherMark(teacher);
  });

  if(state.markLoaded){
    $all('.toggle-group').forEach(group=>{
      group.addEventListener('click', e=>{
        const btn = e.target.closest('.toggle-btn');
        if(!btn) return;
        state.markDraft[group.dataset.student] = btn.dataset.status;
        renderTeacherMark(teacher);
      });
    });
    $('#mark-all-present').addEventListener('click', ()=>{
      Object.keys(state.markDraft).forEach(k=>state.markDraft[k]='P');
      renderTeacherMark(teacher);
    });
    $('#save-attendance-btn').addEventListener('click', async ()=>{
      const date = state.markDate || todayStr();
      const period = state.markPeriod || 1;
      const touched = []; let newCount = 0;
      Object.entries(state.markDraft).forEach(([studentId, status])=>{
        const existing = DB.attendance.find(a=>a.studentId===studentId && a.subjectId===state.markSubject && a.date===date && a.period===period);
        if(existing){ if(existing.status !== status){ existing.status = status; touched.push(existing); } }
        else{ const rec = {id:uid('A'), studentId, subjectId:state.markSubject, teacherId:teacher.id, date, period, status}; DB.attendance.push(rec); touched.push(rec); newCount++; }
      });
      const n = touched.length;
      if(!n){ $('#save-confirm').textContent = 'No changes to save.'; return; }
      if(!BACKEND_ON()){ $('#save-confirm').textContent = 'Saved on this device only ('+n+' records) - not connected to the database.'; return; }
      $('#save-attendance-btn').disabled = true; $('#save-confirm').textContent = 'Saving '+n+' records...';
      const ok = await syncBulkUpsert('attendance', touched);
      const m2 = $('#save-confirm'), b2 = $('#save-attendance-btn');
      if(b2) b2.disabled = false;
      if(ok===false){ if(m2) m2.textContent = 'NOT saved to the database - see the red message and press Save again.'; return; }
      if(m2) m2.textContent = 'Saved '+n+' records for '+date+'. Sending confirmation email…';
      const mr = await mailAttendanceMarked(teacher, subject, date, period, newCount===0);
      const m3 = $('#save-confirm');
      if(m3) m3.textContent = 'Saved '+n+' records for '+date+'. ' + (mr.status==='queued' ? 'Confirmation emailed to '+mr.to+'.' : mr.status==='noemail' ? 'No email address on file for the teacher, so no confirmation was sent.' : 'Confirmation email could not be queued - check the database rules.');
    });
  }

  $('#session-topics').addEventListener('input', e=>{ state.sessionDraft.topics = e.target.value; });
  $('#session-files').addEventListener('change', e=>{
    $('#session-confirm').textContent = 'Reading files…';
    readFilesAsDataUrls(e.target.files).then(({files, oversized})=>{
      state.sessionDraft.files = (state.sessionDraft.files||[]).concat(files);
      if(oversized.length) alert('Skipped (too large, 2 MB max): '+oversized.join(', '));
      renderTeacherMark(teacher);
    });
  });
  $('#save-session-btn').addEventListener('click', async ()=>{
    const date = state.markDate || todayStr(), period = state.markPeriod || 1;
    const existingSession = getSession(state.markSubject, date, period);
    const files = ((existingSession && existingSession.files) || []).concat(state.sessionDraft.files);
    const topics = $('#session-topics').value.trim();
    const msg = $('#session-confirm'), btn = $('#save-session-btn');
    if(!topics && !files.length){ msg.textContent = 'Write the topics covered or attach a file first.'; return; }
    btn.disabled = true; msg.textContent = files.some(f=>f.dataUrl&&!f.fid) ? 'Uploading files…' : 'Saving…';
    const res = await saveSession(state.markSubject, subject.classId, teacher.id, date, period, topics, files);
    btn.disabled = false;
    if(res===false){ msg.style.color='var(--danger)'; msg.textContent = 'NOT saved - see the red message and press Save again.'; return; }
    state.sessionDraft = {topics:null, files:[]};
    if(res==='local'){ msg.textContent = 'Saved on this device only - not connected to the database, so students cannot see it.'; return; }
    renderTeacherMark(teacher);
    const m2 = $('#session-confirm'); if(m2) m2.textContent = 'Saved - students can see it now.';
  });
}

function teacherDayStats(teacher, subjectFilter, dateStr){
  let recs = DB.attendance.filter(a=>a.teacherId===teacher.id && a.date===dateStr);
  if(subjectFilter!=='all') recs = recs.filter(a=>a.subjectId===subjectFilter);
  if(!recs.length) return null;
  const present = recs.filter(r=>r.status==='P').length;
  return {held:recs.length, present, absent:recs.length-present, pct:Math.round((present/recs.length)*1000)/10, recs};
}

function renderRecResults(teacher){

function subjectMonthMatrix(subjectId, monthPrefix){
  const subject = DB.subjects.find(s=>s.id===subjectId);
  const month = monthsData.find(m=>m.prefix===monthPrefix);
  const students = DB.students.filter(s=>s.classId===subject.classId);
  const rows = students.map(s=>{
    const subjDates = month.dates.filter(d=>DB.attendance.some(a=>a.subjectId===subjectId && a.date===d));
    const cells = subjDates.map(d=>{
      const rec = DB.attendance.find(a=>a.studentId===s.id && a.subjectId===subjectId && a.date===d);
      return rec ? rec.status : '-';
    });
    const held = cells.filter(c=>c!=='-').length;
    const present = cells.filter(c=>c==='P').length;
    const pct = held ? Math.round((present/held)*1000)/10 : 0;
    return {student:s, cells, held, present, pct};
  });
  return {subject, month, rows, dates: month.dates.filter(d=>DB.attendance.some(a=>a.subjectId===subjectId && a.date===d))};
}

/* --- Timetable --- */
function ttKey(c,d,p){ return 'TT_'+c+'_'+d+'_'+p; }
function ttDirty(){ return Object.keys(state.ttDraft).length>0 || !!state.periodDraft; }
function ttEffective(c,d,p){ const k=ttKey(c,d,p); return (k in state.ttDraft) ? state.ttDraft[k] : timetableEntry(c,d,p); }
async function saveTimetable(){
  let ups=[], dels=[];
  Object.keys(state.ttDraft).forEach(k=>{ const v=state.ttDraft[k]; if(v===null){ if(DB.timetable.some(t=>t.id===k)) dels.push(k); } else ups.push(v); });
  let setRec=null;
  if(state.periodDraft){
    const pl=state.periodDraft;
    if(pl.some(x=>!x[0]||!x[1]||toMin(x[1])<=toMin(x[0]))){ alert('Every period needs a start time and an end time that is later than its start.'); return; }
    setRec={id:'periods', value:JSON.stringify(pl.map(x=>({s:x[0],e:x[1]})))};
    if(pl.length<PERIODS.length){
      const orphans=DB.timetable.filter(t=>t.period>pl.length);
      if(orphans.length && !confirm('Reducing to '+pl.length+' periods will remove '+orphans.length+' timetable entries that sit in the later periods. Continue?')) return;
      orphans.forEach(t=>{ if(!dels.includes(t.id)) dels.push(t.id); });
      ups=ups.filter(u=>u.period<=pl.length);
    }
  }
  const btn=$('#tt-save'); if(btn){ btn.disabled=true; btn.textContent='Saving…'; }
  const parts=[{table:'timetable',ups,dels}]; if(setRec) parts.push({table:'settings',ups:[setRec],dels:[]});
  const ok=await syncMulti(parts);
  if(!ok){ alert('Could not save — check your connection. Your changes are still here.'); renderAdminTimetable(); return; }
  const ids=new Set(dels.concat(ups.map(u=>u.id)));
  DB.timetable=DB.timetable.filter(t=>!ids.has(t.id)).concat(ups);
  if(setRec){ const i=DB.settings.findIndex(x=>x.id==='periods'); if(i>=0) DB.settings[i]=setRec; else DB.settings.push(setRec); applyPeriodConfig(); }
  state.ttDraft={}; state.periodDraft=null; state.periodGen=null; state.ttSaved=new Date(); renderAdminTimetable();
}
function ttGridHtml(classId){
  const subjectsForClass = DB.subjects.filter(su=>su.classId===classId);
  let rows = '<tr><th>Period</th>' + WEEKDAYS.map(d=>'<th>'+d+'</th>').join('') + '</tr>';
  curPeriodList().forEach((pt,i)=>{
    const period=i+1;
    rows += '<tr><td class="tt-period-label">P'+period+'<div class="tt-period-time">'+(pt[0]||'--:--')+' – '+(pt[1]||'--:--')+'</div></td>';
    WEEKDAYS.forEach(day=>{
      const entry = ttEffective(classId, day, period);
      const isText = !!(entry && !entry.subjectId && entry.text);
      rows += '<td><select data-tt-day="'+day+'" data-tt-period="'+period+'"><option value="">— free —</option>'
        + subjectsForClass.map(su=>'<option value="'+su.id+'" '+(entry && entry.subjectId===su.id?'selected':'')+'>'+escapeHtml(su.name)+' — '+escapeHtml(teacherName(su))+'</option>').join('')
        + '<option value="__text__" '+(isText?'selected':'')+'>✎ Write custom text…</option></select>'
        + '<input type="text" class="tt-text" data-tt-text-day="'+day+'" data-tt-text-period="'+period+'" maxlength="60" placeholder="e.g. Lab, Library, Seminar" value="'+(isText?escapeHtml(entry.text):'')+'" style="'+(isText?'':'display:none;')+'margin-top:4px;font-size:0.78rem;padding:6px 8px;width:100%;"/></td>';
    });
    rows += '</tr>';
  });
  return '<h3>Weekly timetable (subject — faculty)</h3><table class="tt-table">'+rows+'</table>';
}
function ttBar(){
  const st=$('#tt-status'); if(!st) return;
  const n=Object.keys(state.ttDraft).length, pd=!!state.periodDraft, total=n+(pd?1:0);
  const what=[]; if(n) what.push(n+' timetable change'+(n>1?'s':'')); if(pd) what.push('period timings');
  st.textContent = total ? 'Unsaved: '+what.join(' + ')+' — not visible to others yet' : (state.ttSaved?'All saved · published '+state.ttSaved.toLocaleTimeString():'All saved');
  $('#tt-save').disabled=!total; $('#tt-discard').disabled=!total;
}
function renderAdminTimetable(){
  if(!state.adminTimetableClass || !DB.classes.find(c=>c.id===state.adminTimetableClass)) state.adminTimetableClass = DB.classes[0] ? DB.classes[0].id : null;
  let html = '<div class="page-head"><div><h1>Timetable</h1><div class="sub">Edit freely, then press <b>Save &amp; publish</b>. Students and faculty see it within seconds.</div></div></div>';
  if(!DB.classes.length){ html += '<div class="card"><p class="empty">Add a class first.</p></div>'; $('#admin-content').innerHTML = html; return; }
  html += '<div class="card" style="position:sticky;top:58px;z-index:5"><div class="btn-row"><div class="field" style="max-width:300px;margin:0"><label>Class</label><select id="tt-class">'
    + DB.classes.map(c=>'<option value="'+c.id+'" '+(c.id===state.adminTimetableClass?'selected':'')+'>'+c.course+' S'+c.semester+'-'+c.section+'</option>').join('')
    + '</select></div><button class="btn btn-primary" id="tt-save">Save &amp; publish</button><button class="btn btn-ghost" id="tt-discard">Discard changes</button><span id="tt-status" class="sub"></span></div></div>';
  const classId = state.adminTimetableClass;
  html += periodEditorHtml() + '<div class="card" id="tt-grid" style="overflow-x:auto;">'+ttGridHtml(classId)+'</div>';
  $('#admin-content').innerHTML = html;
  function stage(day, period, subjectId, text){
    const k=ttKey(classId,day,period);
    state.ttDraft[k] = (!subjectId && !text) ? null : {id:k, classId, day, period, subjectId, text};
    const cur=timetableEntry(classId,day,period), d=state.ttDraft[k];
    if((!cur&&!d)||(cur&&d&&cur.subjectId===d.subjectId&&(cur.text||'')===(d.text||''))) delete state.ttDraft[k];
    ttBar();
  }
  function textBox(day, period){ return document.querySelector('[data-tt-text-day="'+day+'"][data-tt-text-period="'+period+'"]'); }
  function bindGrid(){
    $all('[data-tt-day]').forEach(sel=>sel.addEventListener('change', e=>{
      const day=sel.dataset.ttDay, period=Number(sel.dataset.ttPeriod), val=e.target.value, tb=textBox(day,period);
      if(val==='__text__'){ tb.style.display=''; tb.focus(); stage(day,period,'',tb.value.trim()); }
      else { tb.style.display='none'; tb.value=''; stage(day,period,val,''); }
    }));
    $all('[data-tt-text-day]').forEach(tb=>tb.addEventListener('input', ()=>{ stage(tb.dataset.ttTextDay, Number(tb.dataset.ttTextPeriod), '', tb.value.trim()); }));
  }
  bindGrid();
  bindPeriodEditor(()=>{ $('#tt-grid').innerHTML=ttGridHtml(classId); bindGrid(); ttBar(); });   // grid follows the period rows live
  ttBar();
  $('#tt-class').addEventListener('change', e=>{ state.adminTimetableClass = e.target.value; renderAdminTimetable(); });
  $('#tt-save').addEventListener('click', saveTimetable);
  $('#tt-discard').addEventListener('click', ()=>{ if(confirm('Discard all unsaved changes?')){ state.ttDraft={}; state.periodDraft=null; state.periodGen=null; renderAdminTimetable(); } });
}
